name: QA Weekly

on:
  schedule:
    # Monday 10:00 KST
    - cron: '0 1 * * 1'
  workflow_dispatch:
    inputs:
      ref:
        description: '검증 대상 git ref'
        required: false
        default: ''

permissions:
  contents: read

env:
  QA_TARGET_REF: ${{ github.event.inputs.ref || vars.QA_TARGET_REF || 'release/v1.3.1' }}

concurrency:
  group: qa-weekly
  cancel-in-progress: false

jobs:
  ios-full:
    runs-on: macos-15
    timeout-minutes: 150
    outputs:
      qa_status: ${{ steps.full.outputs.status }}
      app_build_status: ${{ steps.full.outputs.app_build_status }}
      test_status: ${{ steps.full.outputs.test_status }}
      error_snippet: ${{ steps.full.outputs.error_snippet }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.QA_TARGET_REF }}

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Setup Tuist
        uses: jdx/mise-action@v2

      - name: Cache Tuist
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/tuist
            .build
          key: ${{ runner.os }}-tuist-${{ hashFiles('**/Package.resolved', '**/Project.swift', '**/Tuist/**') }}
          restore-keys: |
            ${{ runner.os }}-tuist-

      - name: Generate xcconfig files
        env:
          GOOGLE_CLIENT_ID_DEV: ${{ secrets.GOOGLE_CLIENT_ID_DEV }}
          GOOGLE_REVERSED_CLIENT_ID_DEV: ${{ secrets.GOOGLE_REVERSED_CLIENT_ID_DEV }}
          KAKAO_NATIVE_APP_KEY_DEV: ${{ secrets.KAKAO_NATIVE_APP_KEY_DEV }}
          GOOGLE_CLIENT_ID_STAGE: ${{ secrets.GOOGLE_CLIENT_ID_STAGE }}
          GOOGLE_REVERSED_CLIENT_ID_STAGE: ${{ secrets.GOOGLE_REVERSED_CLIENT_ID_STAGE }}
          KAKAO_NATIVE_APP_KEY_STAGE: ${{ secrets.KAKAO_NATIVE_APP_KEY_STAGE }}
          GOOGLE_CLIENT_ID_PROD: ${{ secrets.GOOGLE_CLIENT_ID_PROD }}
          GOOGLE_REVERSED_CLIENT_ID_PROD: ${{ secrets.GOOGLE_REVERSED_CLIENT_ID_PROD }}
          KAKAO_NATIVE_APP_KEY_PROD: ${{ secrets.KAKAO_NATIVE_APP_KEY_PROD }}
          CLARITY_PROJECT_ID: ${{ secrets.CLARITY_PROJECT_ID }}
        run: |
          chmod +x ./scripts/generate-xcconfig.sh
          ./scripts/generate-xcconfig.sh

      - name: Setup Firebase plist (Dev)
        run: |
          echo "${{ secrets.GOOGLE_SERVICE_INFO_DEV }}" | base64 --decode > \
            Projects/App/Resources-Dev/GoogleService-Info.plist

      - name: Setup Firebase plist (Stage)
        run: |
          echo "${{ secrets.GOOGLE_SERVICE_INFO_STAGE }}" | base64 --decode > \
            Projects/App/Resources-Stage/GoogleService-Info.plist

      - name: Setup Firebase plist (Prod)
        run: |
          echo "${{ secrets.GOOGLE_SERVICE_INFO_PROD }}" | base64 --decode > \
            Projects/App/Resources-Prod/GoogleService-Info.plist

      - name: Install Dependencies
        run: tuist install

      - name: Generate Project
        run: tuist generate --no-open

      - name: Run Full iOS QA
        id: full
        continue-on-error: true
        run: |
          set -eo pipefail

          DESTINATION='platform=iOS Simulator,name=iPhone 16,OS=latest'
          mkdir -p /tmp/qa-weekly-logs

          summarize_log() {
            local file="$1"
            [ -f "$file" ] || return 0
            local matches
            matches=$(grep -iE 'error:|failed|FAIL|Assertion|Testing failed|\*\* TEST FAILED \*\*' "$file" | tail -5)
            if [ -n "$matches" ]; then
              echo "$matches"
            else
              tail -20 "$file" | grep -v '^$' | tail -5
            fi
          }

          APP_BUILD_STATUS="pass"
          TEST_STATUS="pass"
          ERROR_SNIPPET=""

          if ! tuist build PromisoStage -- \
            -destination "$DESTINATION" \
            -skipPackagePluginValidation \
            > /tmp/qa-weekly-logs/promiso-stage.log 2>&1; then
            APP_BUILD_STATUS="fail"
          fi

          if [ "$APP_BUILD_STATUS" = "pass" ]; then
            if ! tuist test --result-bundle-path WeeklyTestResults -- \
              -destination "$DESTINATION" \
              -skipPackagePluginValidation \
              -enableCodeCoverage YES \
              > /tmp/qa-weekly-logs/tuist-test.log 2>&1; then
              TEST_STATUS="fail"
            fi
          else
            TEST_STATUS="not_run"
          fi

          STATUS="success"
          if [ "$APP_BUILD_STATUS" != "pass" ] || [ "$TEST_STATUS" != "pass" ]; then
            STATUS="failure"
          fi

          if [ "$APP_BUILD_STATUS" != "pass" ]; then
            ERROR_SNIPPET=$(printf '[PromisoStage build]\n%s' "$(summarize_log /tmp/qa-weekly-logs/promiso-stage.log)")
          elif [ "$TEST_STATUS" != "pass" ]; then
            ERROR_SNIPPET=$(printf '[tuist test]\n%s' "$(summarize_log /tmp/qa-weekly-logs/tuist-test.log)")
          fi

          {
            echo "status=$STATUS"
            echo "app_build_status=$APP_BUILD_STATUS"
            echo "test_status=$TEST_STATUS"
            echo "error_snippet<<EOF"
            printf '%s\n' "$ERROR_SNIPPET"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          if [ "$STATUS" != "success" ]; then
            exit 1
          fi

      - name: Upload iOS QA Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-weekly-ios-${{ github.run_id }}
          path: |
            /tmp/qa-weekly-logs
            WeeklyTestResults.xcresult
          if-no-files-found: ignore

      - name: Fail if Full iOS QA Failed
        if: steps.full.outputs.status != 'success'
        run: exit 1

  admin-console:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      qa_status: ${{ steps.verify.outputs.status }}
      failure_step: ${{ steps.verify.outputs.failure_step }}
      error_snippet: ${{ steps.verify.outputs.error_snippet }}

    defaults:
      run:
        working-directory: apps/admin-console

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.QA_TARGET_REF }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/admin-console/package-lock.json

      - name: Run Admin Console QA
        id: verify
        continue-on-error: true
        run: |
          set +e
          summarize_log() {
            local file="$1"
            [ -f "$file" ] || return 0
            local matches
            matches=$(grep -iE 'error:|failed|FAIL|Assertion|Testing failed|\*\* TEST FAILED \*\*' "$file" | tail -5)
            if [ -n "$matches" ]; then
              echo "$matches"
            else
              tail -20 "$file" | grep -v '^$' | tail -5
            fi
          }

          npm ci > /tmp/qa-weekly-admin-install.log 2>&1
          INSTALL_EXIT=$?

          BUILD_EXIT=0
          if [ $INSTALL_EXIT -eq 0 ]; then
            npm run build > /tmp/qa-weekly-admin-build.log 2>&1
            BUILD_EXIT=$?
          else
            BUILD_EXIT=1
          fi

          STATUS="success"
          FAILURE_STEP=""
          ERROR_SNIPPET=""
          if [ $INSTALL_EXIT -ne 0 ]; then
            STATUS="failure"
            FAILURE_STEP="npm ci"
            ERROR_SNIPPET="$(summarize_log /tmp/qa-weekly-admin-install.log)"
          elif [ $BUILD_EXIT -ne 0 ]; then
            STATUS="failure"
            FAILURE_STEP="npm run build"
            ERROR_SNIPPET="$(summarize_log /tmp/qa-weekly-admin-build.log)"
          fi

          {
            echo "status=$STATUS"
            echo "failure_step=$FAILURE_STEP"
            echo "error_snippet<<EOF"
            printf '%s\n' "$ERROR_SNIPPET"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          if [ "$STATUS" != "success" ]; then
            exit 1
          fi

      - name: Fail if Admin Console QA Failed
        if: steps.verify.outputs.status != 'success'
        run: exit 1

  functions:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      qa_status: ${{ steps.verify.outputs.status }}
      failure_step: ${{ steps.verify.outputs.failure_step }}
      error_snippet: ${{ steps.verify.outputs.error_snippet }}

    defaults:
      run:
        working-directory: infra/firebase/functions

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.QA_TARGET_REF }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: infra/firebase/functions/package-lock.json

      - name: Run Functions QA
        id: verify
        continue-on-error: true
        run: |
          set +e
          summarize_log() {
            local file="$1"
            [ -f "$file" ] || return 0
            local matches
            matches=$(grep -iE 'error:|failed|FAIL|Assertion|Testing failed|\*\* TEST FAILED \*\*' "$file" | tail -5)
            if [ -n "$matches" ]; then
              echo "$matches"
            else
              tail -20 "$file" | grep -v '^$' | tail -5
            fi
          }

          npm ci > /tmp/qa-weekly-functions-install.log 2>&1
          INSTALL_EXIT=$?

          LINT_EXIT=0
          TEST_EXIT=0
          BUILD_EXIT=0
          API_VALIDATE_EXIT=0

          if [ $INSTALL_EXIT -eq 0 ]; then
            npm run lint > /tmp/qa-weekly-functions-lint.log 2>&1
            LINT_EXIT=$?

            npm test > /tmp/qa-weekly-functions-test.log 2>&1
            TEST_EXIT=$?

            npm run build > /tmp/qa-weekly-functions-build.log 2>&1
            BUILD_EXIT=$?

            npm run api:validate > /tmp/qa-weekly-functions-api-validate.log 2>&1
            API_VALIDATE_EXIT=$?
          else
            LINT_EXIT=1
            TEST_EXIT=1
            BUILD_EXIT=1
            API_VALIDATE_EXIT=1
          fi

          STATUS="success"
          FAILURE_STEP=""
          ERROR_SNIPPET=""
          if [ $INSTALL_EXIT -ne 0 ]; then
            STATUS="failure"
            FAILURE_STEP="npm ci"
            ERROR_SNIPPET="$(summarize_log /tmp/qa-weekly-functions-install.log)"
          elif [ $LINT_EXIT -ne 0 ]; then
            STATUS="failure"
            FAILURE_STEP="npm run lint"
            ERROR_SNIPPET="$(summarize_log /tmp/qa-weekly-functions-lint.log)"
          elif [ $TEST_EXIT -ne 0 ]; then
            STATUS="failure"
            FAILURE_STEP="npm test"
            ERROR_SNIPPET="$(summarize_log /tmp/qa-weekly-functions-test.log)"
          elif [ $BUILD_EXIT -ne 0 ]; then
            STATUS="failure"
            FAILURE_STEP="npm run build"
            ERROR_SNIPPET="$(summarize_log /tmp/qa-weekly-functions-build.log)"
          elif [ $API_VALIDATE_EXIT -ne 0 ]; then
            STATUS="failure"
            FAILURE_STEP="npm run api:validate"
            ERROR_SNIPPET="$(summarize_log /tmp/qa-weekly-functions-api-validate.log)"
          fi

          {
            echo "status=$STATUS"
            echo "failure_step=$FAILURE_STEP"
            echo "error_snippet<<EOF"
            printf '%s\n' "$ERROR_SNIPPET"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          if [ "$STATUS" != "success" ]; then
            exit 1
          fi

      - name: Fail if Functions QA Failed
        if: steps.verify.outputs.status != 'success'
        run: exit 1

  summary:
    runs-on: ubuntu-latest
    if: always()
    needs:
      - ios-full
      - admin-console
      - functions

    steps:
      - name: Write Summary
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          # QA Weekly Summary

          - Target ref: \`${{ env.QA_TARGET_REF }}\`
          - Schedule: Monday 10:00 KST / 01:00 UTC
          - iOS full status: \`${{ needs.ios-full.result }}\`
          - PromisoStage build: \`${{ needs.ios-full.outputs.app_build_status || 'n/a' }}\`
          - Full test status: \`${{ needs.ios-full.outputs.test_status || 'n/a' }}\`
          - Admin Console status: \`${{ needs.admin-console.result }}\`
          - Firebase Functions status: \`${{ needs.functions.result }}\`
          EOF

          if [ "${{ needs.ios-full.result }}" != "success" ]; then
            cat >> "$GITHUB_STEP_SUMMARY" <<EOF

          ## iOS Failure Highlights

          ```text
          ${{ needs.ios-full.outputs.error_snippet || 'No error snippet captured.' }}
          ```
          EOF
          fi

          if [ "${{ needs.admin-console.result }}" != "success" ]; then
            cat >> "$GITHUB_STEP_SUMMARY" <<EOF

          ## Admin Console Failure Highlights

          - Failed step: \`${{ needs.admin-console.outputs.failure_step || 'unknown' }}\`

          ```text
          ${{ needs.admin-console.outputs.error_snippet || 'No error snippet captured.' }}
          ```
          EOF
          fi

          if [ "${{ needs.functions.result }}" != "success" ]; then
            cat >> "$GITHUB_STEP_SUMMARY" <<EOF

          ## Firebase Functions Failure Highlights

          - Failed step: \`${{ needs.functions.outputs.failure_step || 'unknown' }}\`

          ```text
          ${{ needs.functions.outputs.error_snippet || 'No error snippet captured.' }}
          ```
          EOF
          fi

      - name: Notify Slack
        if: always()
        env:
          SLACK_QA_WEBHOOK_URL: ${{ secrets.SLACK_QA_WEBHOOK_URL }}
        run: |
          IOS_RESULT="${{ needs.ios-full.result }}"
          ADMIN_RESULT="${{ needs.admin-console.result }}"
          FUNCTIONS_RESULT="${{ needs.functions.result }}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          status_emoji() {
            case "$1" in
              success)  echo "✅" ;;
              failure)  echo "❌" ;;
              *)        echo "⚠️" ;;
            esac
          }

          IOS_EMOJI=$(status_emoji "$IOS_RESULT")
          ADMIN_EMOJI=$(status_emoji "$ADMIN_RESULT")
          FUNCTIONS_EMOJI=$(status_emoji "$FUNCTIONS_RESULT")

          if [ "$IOS_RESULT" = "success" ] && [ "$ADMIN_RESULT" = "success" ] && [ "$FUNCTIONS_RESULT" = "success" ]; then
            OVERALL_STATUS="success"
          else
            OVERALL_STATUS="failure"
          fi

          if [ "$OVERALL_STATUS" = "success" ]; then
            PAYLOAD=$(cat <<JSON
          {
            "blocks": [
              {"type": "header", "text": {"type": "plain_text", "text": "✅ QA Weekly 성공"}},
              {"type": "section", "fields": [
                {"type": "mrkdwn", "text": "*Ref:* \`${{ env.QA_TARGET_REF }}\`"},
                {"type": "mrkdwn", "text": "*iOS:* ${IOS_EMOJI}"},
                {"type": "mrkdwn", "text": "*Admin:* ${ADMIN_EMOJI}"},
                {"type": "mrkdwn", "text": "*Functions:* ${FUNCTIONS_EMOJI}"}
              ]},
              {"type": "actions", "elements": [
                {"type": "button", "text": {"type": "plain_text", "text": "Run 보기"}, "url": "${RUN_URL}"}
              ]}
            ]
          }
          JSON
          )
          else
            IOS_SNIPPET="${{ needs.ios-full.outputs.error_snippet }}"
            ADMIN_SNIPPET="${{ needs.admin-console.outputs.error_snippet }}"
            FUNCTIONS_SNIPPET="${{ needs.functions.outputs.error_snippet }}"

            ERROR_SUMMARY=""
            if [ "$IOS_RESULT" != "success" ] && [ -n "$IOS_SNIPPET" ]; then
              ERROR_SUMMARY="[iOS]\n${IOS_SNIPPET}"
            fi
            if [ "$ADMIN_RESULT" != "success" ] && [ -n "$ADMIN_SNIPPET" ]; then
              if [ -n "$ERROR_SUMMARY" ]; then ERROR_SUMMARY="${ERROR_SUMMARY}\n"; fi
              ERROR_SUMMARY="${ERROR_SUMMARY}[Admin]\n${ADMIN_SNIPPET}"
            fi
            if [ "$FUNCTIONS_RESULT" != "success" ] && [ -n "$FUNCTIONS_SNIPPET" ]; then
              if [ -n "$ERROR_SUMMARY" ]; then ERROR_SUMMARY="${ERROR_SUMMARY}\n"; fi
              ERROR_SUMMARY="${ERROR_SUMMARY}[Functions]\n${FUNCTIONS_SNIPPET}"
            fi
            if [ -z "$ERROR_SUMMARY" ]; then
              ERROR_SUMMARY="No error snippet captured."
            fi

            ERROR_SUMMARY_ESCAPED=$(printf '%s' "$ERROR_SUMMARY" | python3 -c "import sys,json; print(json.dumps(sys.stdin.read()))" | sed 's/^"//;s/"$//')

            PAYLOAD=$(cat <<JSON
          {
            "blocks": [
              {"type": "header", "text": {"type": "plain_text", "text": "🔴 QA Weekly 실패"}},
              {"type": "section", "fields": [
                {"type": "mrkdwn", "text": "*Ref:* \`${{ env.QA_TARGET_REF }}\`"},
                {"type": "mrkdwn", "text": "*iOS:* ${IOS_EMOJI}"},
                {"type": "mrkdwn", "text": "*Admin:* ${ADMIN_EMOJI}"},
                {"type": "mrkdwn", "text": "*Functions:* ${FUNCTIONS_EMOJI}"}
              ]},
              {"type": "section", "text": {"type": "mrkdwn", "text": "*에러 요약*\n\`\`\`${ERROR_SUMMARY_ESCAPED}\`\`\`"}},
              {"type": "actions", "elements": [
                {"type": "button", "text": {"type": "plain_text", "text": "Run 보기"}, "url": "${RUN_URL}"}
              ]}
            ]
          }
          JSON
          )
          fi

          curl -fsSL -X POST \
            -H 'Content-Type: application/json' \
            -d "$PAYLOAD" \
            "$SLACK_QA_WEBHOOK_URL"
