name: Deploy Firebase (Dev)

on:
  push:
    branches: [develop]
    paths:
      - 'infra/firebase/**'
      - '.github/workflows/deploy-firebase-dev.yml'

concurrency:
  group: firebase-dev
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      # 1. 체크아웃 및 환경 설정
      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: infra/firebase/functions/package-lock.json

      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      # 2. Functions 의존성 설치
      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

      - name: Install Functions Dependencies
        working-directory: infra/firebase/functions
        run: npm ci

      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      # 3. Lint 및 빌드
      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

      - name: Lint Functions
        working-directory: infra/firebase/functions
        run: npm run lint

      - name: Build Functions
        working-directory: infra/firebase/functions
        run: npm run build

      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      # 4. Firebase 배포
      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

      - name: Deploy to Firebase (Dev)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEV }}'
          projectId: promiso-dev
          channelId: live
        env:
          FIREBASE_CLI_EXPERIMENTS: webframeworks

      - name: Deploy Functions
        working-directory: infra/firebase
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          npm install -g firebase-tools
          firebase use dev
          firebase deploy --only functions --token "$FIREBASE_TOKEN" --non-interactive

      - name: Deploy Firestore Rules
        working-directory: infra/firebase
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          firebase use dev
          firebase deploy --only firestore:rules --token "$FIREBASE_TOKEN" --non-interactive

      - name: Deploy Storage Rules
        working-directory: infra/firebase
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          firebase use dev
          firebase deploy --only storage --token "$FIREBASE_TOKEN" --non-interactive

      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      # 5. Slack 알림 (선택)
      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

      - name: Slack Notification
        if: always()
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: |
            🔥 Firebase Dev 배포 ${{ job.status == 'success' && '성공' || '실패' }}
            - Functions: ✅
            - Firestore Rules: ✅
            - Storage Rules: ✅
          webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}
          username: 'Firebase CI'
          icon_emoji: ':fire:'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
