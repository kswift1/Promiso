name: Admin Console Check

on:
  pull_request:
    branches: [develop, staging, main, 'release/**']
    paths:
      - 'apps/admin-console/**'
      - '.github/workflows/admin-console-check.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: apps/admin-console

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/admin-console/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Build
        run: npm run build

