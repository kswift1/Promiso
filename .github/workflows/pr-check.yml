name: PR Check

on:
  pull_request:
    branches: [develop, staging, main, 'release/**']
  issue_comment:
    types: [created]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  build-and-test:
    # PR 이벤트 또는 PR 코멘트에서 /check 명령어
    if: >
      github.event_name == 'pull_request' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       startsWith(github.event.comment.body, '/check'))
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      pull-requests: write
      issues: write

    steps:
      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      # 0. /check 명령어 처리 (코멘트 트리거)
      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

      - name: React to /check command
        if: github.event_name == 'issue_comment'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'rocket'
            });

      - name: Get PR ref
        id: pr-ref
        uses: actions/github-script@v7
        with:
          script: |
            let ref, sha, prNumber;
            if (context.eventName === 'issue_comment') {
              prNumber = context.issue.number;
              const { data: pr } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber,
              });
              ref = pr.head.ref;
              sha = pr.head.sha;
            } else {
              ref = context.payload.pull_request.head.ref;
              sha = context.payload.pull_request.head.sha;
              prNumber = context.payload.pull_request.number;
            }
            core.setOutput('ref', ref);
            core.setOutput('sha', sha);
            core.setOutput('pr_number', prNumber);

      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      # 1. 체크아웃 및 환경 설정
      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr-ref.outputs.ref }}

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Setup Tuist
        uses: jdx/mise-action@v2

      - name: Cache Tuist
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/tuist
            .build
          key: ${{ runner.os }}-tuist-${{ hashFiles('**/Package.resolved', '**/Project.swift', '**/Tuist/**') }}
          restore-keys: |
            ${{ runner.os }}-tuist-

      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      # 2. xcconfig 파일 생성 (API 키)
      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

      - name: Generate xcconfig files
        env:
          # Dev 환경 (PR 체크용)
          GOOGLE_CLIENT_ID_DEV: ${{ secrets.GOOGLE_CLIENT_ID_DEV }}
          GOOGLE_REVERSED_CLIENT_ID_DEV: ${{ secrets.GOOGLE_REVERSED_CLIENT_ID_DEV }}
          KAKAO_NATIVE_APP_KEY_DEV: ${{ secrets.KAKAO_NATIVE_APP_KEY_DEV }}
          # Stage 환경 (선택)
          GOOGLE_CLIENT_ID_STAGE: ${{ secrets.GOOGLE_CLIENT_ID_STAGE }}
          GOOGLE_REVERSED_CLIENT_ID_STAGE: ${{ secrets.GOOGLE_REVERSED_CLIENT_ID_STAGE }}
          KAKAO_NATIVE_APP_KEY_STAGE: ${{ secrets.KAKAO_NATIVE_APP_KEY_STAGE }}
          # Prod 환경 (선택)
          GOOGLE_CLIENT_ID_PROD: ${{ secrets.GOOGLE_CLIENT_ID_PROD }}
          GOOGLE_REVERSED_CLIENT_ID_PROD: ${{ secrets.GOOGLE_REVERSED_CLIENT_ID_PROD }}
          KAKAO_NATIVE_APP_KEY_PROD: ${{ secrets.KAKAO_NATIVE_APP_KEY_PROD }}
          # Microsoft Clarity (환경 공통)
          CLARITY_PROJECT_ID: ${{ secrets.CLARITY_PROJECT_ID }}
        run: |
          chmod +x ./scripts/generate-xcconfig.sh
          ./scripts/generate-xcconfig.sh

      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      # 3. Firebase plist 파일 복사
      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

      - name: Setup Firebase plist (Dev)
        run: |
          echo "${{ secrets.GOOGLE_SERVICE_INFO_DEV }}" | base64 --decode > \
            Projects/App/Resources-Dev/GoogleService-Info.plist

      - name: Setup Firebase plist (Stage)
        run: |
          echo "${{ secrets.GOOGLE_SERVICE_INFO_STAGE }}" | base64 --decode > \
            Projects/App/Resources-Stage/GoogleService-Info.plist

      - name: Setup Firebase plist (Prod)
        run: |
          echo "${{ secrets.GOOGLE_SERVICE_INFO_PROD }}" | base64 --decode > \
            Projects/App/Resources-Prod/GoogleService-Info.plist

      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      # 4. 프로젝트 생성 및 의존성 설치
      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

      - name: Install Dependencies
        run: tuist install

      - name: Generate Project
        run: tuist generate --no-open

      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      # 5. 빌드 (Dev 타겟)
      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

      - name: Build PromisoDev
        run: |
          tuist build PromisoDev -- \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -skipPackagePluginValidation

      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      # 6. 테스트 실행 (커버리지 포함)
      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

      - name: Run Tests with Coverage
        run: |
          tuist test --result-bundle-path TestResults -- \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -skipPackagePluginValidation \
            -enableCodeCoverage YES

      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      # 7. 커버리지 리포트 추출
      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

      - name: Extract Coverage Report
        id: coverage
        if: always()
        run: |
          RESULT_BUNDLE="TestResults.xcresult"

          if [ ! -d "$RESULT_BUNDLE" ]; then
            echo "report=커버리지 데이터 없음 (xcresult 번들을 찾을 수 없음)" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # JSON 커버리지 리포트 추출
          COVERAGE_JSON=$(xcrun xccov view --report --json "$RESULT_BUNDLE" 2>/dev/null || true)

          if [ -z "$COVERAGE_JSON" ]; then
            echo "report=커버리지 데이터를 추출할 수 없음" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 모듈별 커버리지 추출 (관심 대상 모듈만 필터링)
          MODULES=("Clients" "PromisoShared" "HomeFeature" "AuthFeature" "GroupFeature" "CalendarFeature" "SettingsFeature" "RootTabFeature" "AppEntryFeature" "SharedFeature" "NotificationCenterFeature")

          TABLE="| 모듈 | 커버리지 | 상태 |\n|------|---------|------|\n"

          TOTAL_COVERED=0
          TOTAL_LINES=0

          for MODULE in "${MODULES[@]}"; do
            # jq로 해당 모듈의 커버리지 추출
            COVERAGE=$(echo "$COVERAGE_JSON" | jq -r --arg mod "$MODULE" '
              .targets[]
              | select(.name == ($mod + ".framework"))
              | .lineCoverage * 100
              | . * 10 | floor | . / 10
            ' 2>/dev/null)

            COVERED=$(echo "$COVERAGE_JSON" | jq -r --arg mod "$MODULE" '
              .targets[]
              | select(.name == ($mod + ".framework"))
              | .coveredLines
            ' 2>/dev/null)

            EXECUTABLE=$(echo "$COVERAGE_JSON" | jq -r --arg mod "$MODULE" '
              .targets[]
              | select(.name == ($mod + ".framework"))
              | .executableLines
            ' 2>/dev/null)

            if [ -n "$COVERAGE" ] && [ "$COVERAGE" != "null" ]; then
              # 상태 아이콘 결정
              STATUS="🟢"
              COV_INT=${COVERAGE%.*}
              if [ "${COV_INT:-0}" -lt 30 ]; then
                STATUS="🔴"
              elif [ "${COV_INT:-0}" -lt 50 ]; then
                STATUS="🟡"
              fi

              TABLE="${TABLE}| ${MODULE} | ${COVERAGE}% | ${STATUS} |\n"

              if [ -n "$COVERED" ] && [ -n "$EXECUTABLE" ]; then
                TOTAL_COVERED=$((TOTAL_COVERED + ${COVERED:-0}))
                TOTAL_LINES=$((TOTAL_LINES + ${EXECUTABLE:-0}))
              fi
            fi
          done

          # 전체 커버리지 계산
          if [ "$TOTAL_LINES" -gt 0 ]; then
            TOTAL_PCT=$(echo "scale=1; $TOTAL_COVERED * 100 / $TOTAL_LINES" | bc)
            TABLE="${TABLE}| **전체** | **${TOTAL_PCT}%** | |\n"
          fi

          # GitHub Output에 저장 (멀티라인)
          {
            echo "report<<COVERAGE_EOF"
            echo -e "$TABLE"
            echo "COVERAGE_EOF"
          } >> "$GITHUB_OUTPUT"

      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      # 8. 테스트 결과 업로드 (실패 시)
      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

      - name: Upload Test Results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            **/*.xcresult
            **/test_output/

      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      # 9. PR 코멘트 (빌드/테스트 + 커버리지)
      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

      - name: Comment PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = ${{ steps.pr-ref.outputs.pr_number }};
            const branch = '${{ steps.pr-ref.outputs.ref }}';
            const sha = '${{ steps.pr-ref.outputs.sha }}';
            const status = '${{ job.status }}' === 'success' ? '✅' : '❌';
            const isSlashCommand = '${{ github.event_name }}' === 'issue_comment';
            const trigger = isSlashCommand ? '(`/check` 명령어)' : '';
            const coverageReport = `${{ steps.coverage.outputs.report }}`;

            let message = `${status} **PR 체크 ${status === '✅' ? '성공' : '실패'}** ${trigger}

            **빌드**: ${status === '✅' ? '성공' : '실패'}
            **테스트**: ${status === '✅' ? '통과' : '실패'}`;

            if (coverageReport && coverageReport.trim() !== '') {
              message += `

            <details>
            <summary>📊 모듈별 커버리지</summary>

            ${coverageReport}

            > 🔴 30% 미만 | 🟡 30~50% | 🟢 50% 이상

            </details>`;
            }

            message += `

            <details>
            <summary>상세 정보</summary>

            - Workflow: ${{ github.workflow }}
            - Branch: ${branch}
            - Commit: ${sha}

            </details>`;

            // 기존 봇 코멘트 업데이트 (중복 방지)
            const { data: comments } = await github.rest.issues.listComments({
              issue_number: prNumber,
              owner: context.repo.owner,
              repo: context.repo.repo,
            });

            const botComment = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('PR 체크')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                comment_id: botComment.id,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: message,
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: prNumber,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: message,
              });
            }
