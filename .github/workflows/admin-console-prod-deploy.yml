name: Admin Console Prod Deploy

on:
  workflow_dispatch:

concurrency:
  group: admin-console-prod-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://promiso-prod-admin.web.app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/admin-console/package-lock.json

      - name: Install Dependencies
        working-directory: apps/admin-console
        run: npm ci

      - name: Validate Prod Firebase Config
        env:
          ADMIN_CONSOLE_PROD_FIREBASE_API_KEY: ${{ vars.ADMIN_CONSOLE_PROD_FIREBASE_API_KEY }}
          ADMIN_CONSOLE_PROD_FIREBASE_AUTH_DOMAIN: ${{ vars.ADMIN_CONSOLE_PROD_FIREBASE_AUTH_DOMAIN }}
          ADMIN_CONSOLE_PROD_FIREBASE_PROJECT_ID: ${{ vars.ADMIN_CONSOLE_PROD_FIREBASE_PROJECT_ID }}
          ADMIN_CONSOLE_PROD_FIREBASE_APP_ID: ${{ vars.ADMIN_CONSOLE_PROD_FIREBASE_APP_ID }}
        run: |
          for key in \
            ADMIN_CONSOLE_PROD_FIREBASE_API_KEY \
            ADMIN_CONSOLE_PROD_FIREBASE_AUTH_DOMAIN \
            ADMIN_CONSOLE_PROD_FIREBASE_PROJECT_ID \
            ADMIN_CONSOLE_PROD_FIREBASE_APP_ID
          do
            if [ -z "${!key}" ]; then
              echo "::error title=Missing admin console prod config::$key is empty. Set the production environment variable before deploying."
              exit 1
            fi
          done

      - name: Write Prod Env
        working-directory: apps/admin-console
        run: |
          cat <<EOF > .env.production.local
          VITE_FIREBASE_API_KEY=${{ vars.ADMIN_CONSOLE_PROD_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN=${{ vars.ADMIN_CONSOLE_PROD_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID=${{ vars.ADMIN_CONSOLE_PROD_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID=${{ vars.ADMIN_CONSOLE_PROD_FIREBASE_APP_ID }}
          EOF

      - name: Build Admin Console
        working-directory: apps/admin-console
        run: npm run build -- --mode production

      - name: Deploy Hosting
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          npm install -g firebase-tools
          firebase deploy \
            --only hosting:admin-console \
            --project promiso-prod \
            --token "$FIREBASE_TOKEN" \
            --non-interactive
