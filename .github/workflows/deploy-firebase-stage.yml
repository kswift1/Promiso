name: Deploy Firebase (Stage)

on:
  push:
    branches: [staging]
    paths:
      - 'infra/firebase/**'
      - '.github/workflows/deploy-firebase-stage.yml'

concurrency:
  group: firebase-stage
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: infra/firebase/functions/package-lock.json

      - name: Install Functions Dependencies
        working-directory: infra/firebase/functions
        run: npm ci

      - name: Lint Functions
        working-directory: infra/firebase/functions
        run: npm run lint

      - name: Build Functions
        working-directory: infra/firebase/functions
        run: npm run build

      - name: Deploy to Firebase (Stage)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_STAGE }}'
          projectId: promiso-stage
          channelId: live
        env:
          FIREBASE_CLI_EXPERIMENTS: webframeworks

      - name: Deploy Functions
        working-directory: infra/firebase
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          npm install -g firebase-tools
          firebase use stage
          firebase deploy --only functions --token "$FIREBASE_TOKEN" --non-interactive

      - name: Deploy Firestore Rules
        working-directory: infra/firebase
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          firebase use stage
          firebase deploy --only firestore:rules --token "$FIREBASE_TOKEN" --non-interactive

      - name: Deploy Storage Rules
        working-directory: infra/firebase
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          firebase use stage
          firebase deploy --only storage --token "$FIREBASE_TOKEN" --non-interactive

      - name: Slack Notification
        if: always()
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: |
            🟡 Firebase Stage 배포 ${{ job.status == 'success' && '성공' || '실패' }}
            - Functions: ✅
            - Firestore Rules: ✅
            - Storage Rules: ✅
            (QA 환경 준비 완료)
          webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}
          username: 'Firebase CI'
          icon_emoji: ':fire:'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
