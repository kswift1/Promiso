name: Deploy Firebase

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        type: choice
        options:
          - dev
          - stage
          - prod

concurrency:
  group: firebase-${{ github.event.inputs.environment }}
  cancel-in-progress: false

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.env.outputs.environment }}
      project_id: ${{ steps.env.outputs.project_id }}
      emoji: ${{ steps.env.outputs.emoji }}
      env_label: ${{ steps.env.outputs.env_label }}

    steps:
      - name: Determine Environment
        id: env
        run: |
          ENV="${{ github.event.inputs.environment }}"

          case "$ENV" in
            dev)
              PROJECT_ID="promiso-dev"
              EMOJI="🟢"
              ENV_LABEL="Dev"
              ;;
            stage)
              PROJECT_ID="promiso-stage"
              EMOJI="🟡"
              ENV_LABEL="Stage"
              ;;
            prod)
              PROJECT_ID="promiso-prod"
              EMOJI="🚀"
              ENV_LABEL="Production"
              ;;
            *)
              echo "::error::Invalid environment: $ENV"
              exit 1
              ;;
          esac

          {
            echo "environment=$ENV"
            echo "project_id=$PROJECT_ID"
            echo "emoji=$EMOJI"
            echo "env_label=$ENV_LABEL"
          } >> "$GITHUB_OUTPUT"

          echo "🎯 Environment: $ENV_LABEL ($ENV)"
          echo "📦 Project ID: $PROJECT_ID"

  deploy:
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: ${{ needs.setup.outputs.environment == 'prod' && 'production' || (needs.setup.outputs.environment == 'stage' && 'staging' || 'development') }}
      url: ${{ needs.setup.outputs.environment == 'prod' && 'https://promiso.app' || '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: infra/firebase/functions/package-lock.json

      - name: Install Functions Dependencies
        working-directory: infra/firebase/functions
        run: npm ci

      - name: Lint Functions
        working-directory: infra/firebase/functions
        run: npm run lint

      - name: Build Functions
        working-directory: infra/firebase/functions
        run: npm run build

      - name: Write Functions Env (Analytics 값)
        working-directory: infra/firebase/functions
        run: |
          cat <<EOF > .env.${{ needs.setup.outputs.project_id }}
          GA4_PROPERTY_ID=${{ vars.GA4_PROPERTY_ID }}
          ANALYTICS_BIGQUERY_PROJECT_ID=${{ vars.ANALYTICS_BIGQUERY_PROJECT_ID }}
          ANALYTICS_BIGQUERY_DATASET_ID=${{ vars.ANALYTICS_BIGQUERY_DATASET_ID }}
          ANALYTICS_BIGQUERY_LOCATION=${{ vars.ANALYTICS_BIGQUERY_LOCATION }}
          EOF

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Deploy Functions
        working-directory: infra/firebase
        run: |
          npx --yes firebase-tools@latest use ${{ needs.setup.outputs.environment }}
          npx --yes firebase-tools@latest deploy \
            --only functions,firestore:rules,storage \
            --project ${{ needs.setup.outputs.project_id }} \
            --non-interactive

      - name: Slack Notification
        if: always()
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: |
            ${{ needs.setup.outputs.emoji }} Firebase ${{ needs.setup.outputs.env_label }} 배포 ${{ job.status == 'success' && '성공' || '실패' }}
            - Functions / Firestore Rules / Storage Rules
            ${{ needs.setup.outputs.environment == 'stage' && '(QA 환경 준비 완료)' || '' }}
          username: 'Firebase CI'
          icon_emoji: ':fire:'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
