name: Deploy Firebase

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        type: choice
        options:
          - stage
          - prod

concurrency:
  group: firebase-${{ github.event.inputs.environment }}
  cancel-in-progress: false

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.env.outputs.environment }}
      project_id: ${{ steps.env.outputs.project_id }}
      service_account: ${{ steps.env.outputs.service_account }}
      emoji: ${{ steps.env.outputs.emoji }}
      env_label: ${{ steps.env.outputs.env_label }}

    steps:
      - name: Determine Environment
        id: env
        run: |
          ENV="${{ github.event.inputs.environment }}"

          # 환경별 변수 설정
          case "$ENV" in
            stage)
              PROJECT_ID="promiso-stage"
              SERVICE_ACCOUNT="FIREBASE_SERVICE_ACCOUNT_STAGE"
              EMOJI="🟡"
              ENV_LABEL="Stage"
              ;;
            prod)
              PROJECT_ID="promiso-prod"
              SERVICE_ACCOUNT="FIREBASE_SERVICE_ACCOUNT_PROD"
              EMOJI="🚀"
              ENV_LABEL="Production"
              ;;
            *)
              echo "::error::Invalid environment: $ENV"
              exit 1
              ;;
          esac

          # Output 설정
          echo "environment=$ENV" >> $GITHUB_OUTPUT
          echo "project_id=$PROJECT_ID" >> $GITHUB_OUTPUT
          echo "service_account=$SERVICE_ACCOUNT" >> $GITHUB_OUTPUT
          echo "emoji=$EMOJI" >> $GITHUB_OUTPUT
          echo "env_label=$ENV_LABEL" >> $GITHUB_OUTPUT

          # 로그 출력
          echo "🎯 Environment: $ENV_LABEL ($ENV)"
          echo "📦 Project ID: $PROJECT_ID"

  deploy:
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: ${{ needs.setup.outputs.environment == 'prod' && 'production' || (needs.setup.outputs.environment == 'stage' && 'staging' || 'development') }}
      url: ${{ needs.setup.outputs.environment == 'prod' && 'https://promiso.app' || '' }}

    steps:
      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      # 1. 체크아웃 및 환경 설정
      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: infra/firebase/functions/package-lock.json

      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      # 2. Functions 의존성 설치
      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

      - name: Install Functions Dependencies
        working-directory: infra/firebase/functions
        run: npm ci

      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      # 3. Lint 및 빌드
      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

      - name: Lint Functions
        working-directory: infra/firebase/functions
        run: npm run lint

      - name: Build Functions
        working-directory: infra/firebase/functions
        run: npm run build

      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      # 4. Firebase 배포
      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

      - name: Deploy Functions
        working-directory: infra/firebase
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          npm install -g firebase-tools
          firebase use ${{ needs.setup.outputs.environment }}
          firebase deploy --only functions --token "$FIREBASE_TOKEN" --non-interactive

      - name: Deploy Firestore Rules
        working-directory: infra/firebase
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          firebase use ${{ needs.setup.outputs.environment }}
          firebase deploy --only firestore:rules --token "$FIREBASE_TOKEN" --non-interactive

      - name: Deploy Storage Rules
        working-directory: infra/firebase
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          firebase use ${{ needs.setup.outputs.environment }}
          firebase deploy --only storage --token "$FIREBASE_TOKEN" --non-interactive

      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      # 5. Slack 알림
      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

      - name: Slack Notification
        if: always()
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: |
            ${{ needs.setup.outputs.emoji }} Firebase ${{ needs.setup.outputs.env_label }} 배포 ${{ job.status == 'success' && '성공' || '실패' }}
            - Functions: ✅
            - Firestore Rules: ✅
            - Storage Rules: ✅
            ${{ needs.setup.outputs.environment == 'stage' && '(QA 환경 준비 완료)' || '' }}
          username: 'Firebase CI'
          icon_emoji: ':fire:'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
