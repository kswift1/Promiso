name: Deploy Firebase

on:
  push:
    branches: [develop, staging, main]
    paths:
      - 'infra/firebase/**'
      - '.github/workflows/deploy-firebase.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        type: choice
        options:
          - dev
          - stage
          - prod

concurrency:
  group: firebase-${{ github.event.inputs.environment || (github.ref_name == 'develop' && 'dev') || (github.ref_name == 'staging' && 'stage') || (github.ref_name == 'main' && 'prod') }}
  cancel-in-progress: false

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.env.outputs.environment }}
      project_id: ${{ steps.env.outputs.project_id }}
      service_account: ${{ steps.env.outputs.service_account }}
      emoji: ${{ steps.env.outputs.emoji }}
      env_label: ${{ steps.env.outputs.env_label }}

    steps:
      - name: Determine Environment
        id: env
        run: |
          # workflow_dispatch 수동 실행 시
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            ENV="${{ github.event.inputs.environment }}"
          # 브랜치 기반 자동 환경 결정
          else
            case "${{ github.ref_name }}" in
              develop) ENV="dev" ;;
              staging) ENV="stage" ;;
              main) ENV="prod" ;;
              *)
                echo "::error::Unknown branch: ${{ github.ref_name }}"
                exit 1
                ;;
            esac
          fi

          # 환경별 변수 설정
          case "$ENV" in
            dev)
              PROJECT_ID="promiso-dev"
              SERVICE_ACCOUNT="FIREBASE_SERVICE_ACCOUNT_DEV"
              EMOJI="🔥"
              ENV_LABEL="Dev"
              ;;
            stage)
              PROJECT_ID="promiso-stage"
              SERVICE_ACCOUNT="FIREBASE_SERVICE_ACCOUNT_STAGE"
              EMOJI="🟡"
              ENV_LABEL="Stage"
              ;;
            prod)
              PROJECT_ID="promiso-prod"
              SERVICE_ACCOUNT="FIREBASE_SERVICE_ACCOUNT_PROD"
              EMOJI="🚀"
              ENV_LABEL="Production"
              ;;
          esac

          # Output 설정
          echo "environment=$ENV" >> $GITHUB_OUTPUT
          echo "project_id=$PROJECT_ID" >> $GITHUB_OUTPUT
          echo "service_account=$SERVICE_ACCOUNT" >> $GITHUB_OUTPUT
          echo "emoji=$EMOJI" >> $GITHUB_OUTPUT
          echo "env_label=$ENV_LABEL" >> $GITHUB_OUTPUT

          # 로그 출력
          echo "🎯 Environment: $ENV_LABEL ($ENV)"
          echo "📦 Project ID: $PROJECT_ID"

  deploy:
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: ${{ needs.setup.outputs.environment == 'prod' && 'production' || (needs.setup.outputs.environment == 'stage' && 'staging' || 'development') }}
      url: ${{ needs.setup.outputs.environment == 'prod' && 'https://promiso.app' || '' }}

    steps:
      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      # 1. 체크아웃 및 환경 설정
      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: infra/firebase/functions/package-lock.json

      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      # 2. Functions 의존성 설치
      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

      - name: Install Functions Dependencies
        working-directory: infra/firebase/functions
        run: npm ci

      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      # 3. Lint 및 빌드
      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

      - name: Lint Functions
        working-directory: infra/firebase/functions
        run: npm run lint

      - name: Build Functions
        working-directory: infra/firebase/functions
        run: npm run build

      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      # 4. Firebase 배포
      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

      - name: Deploy Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets[needs.setup.outputs.service_account] }}'
          projectId: ${{ needs.setup.outputs.project_id }}
          channelId: live
        env:
          FIREBASE_CLI_EXPERIMENTS: webframeworks

      - name: Deploy Functions
        working-directory: infra/firebase
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          npm install -g firebase-tools
          firebase use ${{ needs.setup.outputs.environment }}
          firebase deploy --only functions --token "$FIREBASE_TOKEN" --non-interactive

      - name: Deploy Firestore Rules
        working-directory: infra/firebase
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          firebase use ${{ needs.setup.outputs.environment }}
          firebase deploy --only firestore:rules --token "$FIREBASE_TOKEN" --non-interactive

      - name: Deploy Storage Rules
        working-directory: infra/firebase
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          firebase use ${{ needs.setup.outputs.environment }}
          firebase deploy --only storage --token "$FIREBASE_TOKEN" --non-interactive

      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      # 5. Slack 알림
      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

      - name: Slack Notification
        if: always()
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: |
            ${{ needs.setup.outputs.emoji }} Firebase ${{ needs.setup.outputs.env_label }} 배포 ${{ job.status == 'success' && '성공' || '실패' }}
            - Functions: ✅
            - Firestore Rules: ✅
            - Storage Rules: ✅
            ${{ needs.setup.outputs.environment == 'stage' && '(QA 환경 준비 완료)' || '' }}
          webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}
          username: 'Firebase CI'
          icon_emoji: ':fire:'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
