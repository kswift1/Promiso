name: Deploy Firebase Stage (Auto)

# release/* 브랜치에 PR 머지 시 자동 stage 배포
on:
  push:
    branches:
      - 'release/**'
    paths:
      - 'infra/firebase/**'
      - '.github/workflows/deploy-firebase-stage-auto.yml'

concurrency:
  group: firebase-stage-auto
  cancel-in-progress: false

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: staging
      url: https://console.firebase.google.com/project/promiso-stage

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: infra/firebase/functions/package-lock.json

      - name: Install Functions Dependencies
        working-directory: infra/firebase/functions
        run: npm ci

      - name: Lint Functions
        working-directory: infra/firebase/functions
        run: npm run lint

      - name: Run Tests (if exists)
        working-directory: infra/firebase/functions
        run: |
          if grep -q '"test"' package.json; then
            npm test
          else
            echo "⚠️ No tests found. Skipping..."
          fi

      - name: Build Functions
        working-directory: infra/firebase/functions
        run: npm run build

      - name: Write Functions Env (Stage — Analytics 값)
        working-directory: infra/firebase/functions
        run: |
          cat <<EOF > .env.promiso-stage
          GA4_PROPERTY_ID=${{ vars.GA4_PROPERTY_ID }}
          ANALYTICS_BIGQUERY_PROJECT_ID=${{ vars.ANALYTICS_BIGQUERY_PROJECT_ID }}
          ANALYTICS_BIGQUERY_DATASET_ID=${{ vars.ANALYTICS_BIGQUERY_DATASET_ID }}
          ANALYTICS_BIGQUERY_LOCATION=${{ vars.ANALYTICS_BIGQUERY_LOCATION }}
          EOF

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Deploy to Stage
        id: deploy
        working-directory: infra/firebase
        run: |
          npx --yes firebase-tools@latest use stage
          npx --yes firebase-tools@latest deploy \
            --only functions,firestore:rules,storage \
            --project promiso-stage \
            --non-interactive

      - name: Health Check Functions
        continue-on-error: true
        run: |
          echo "⚠️ Health check endpoint not configured. Skipping..."

      - name: Slack Notification (Success)
        if: success()
        uses: 8398a7/action-slack@v3
        with:
          status: custom
          custom_payload: |
            {
              "text": "🟡 Firebase Stage 자동 배포 성공",
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "✅ Firebase Stage 배포 완료"
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    {"type": "mrkdwn", "text": "*Environment:*\nStage"},
                    {"type": "mrkdwn", "text": `*Branch:*\n${process.env.GITHUB_REF_NAME}`},
                    {"type": "mrkdwn", "text": `*Commit:*\n<https://github.com/${process.env.GITHUB_REPOSITORY}/commit/${process.env.GITHUB_SHA}|${process.env.GITHUB_SHA.substring(0, 7)}>`},
                    {"type": "mrkdwn", "text": `*Workflow:*\n<https://github.com/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}|View Logs>`}
                  ]
                },
                {
                  "type": "section",
                  "text": {"type": "mrkdwn", "text": "✅ Functions\n✅ Firestore Rules\n✅ Storage Rules"}
                },
                {
                  "type": "context",
                  "elements": [{"type": "mrkdwn", "text": "🎯 QA 테스트 준비 완료"}]
                }
              ]
            }
          username: 'Firebase CI'
          icon_emoji: ':fire:'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL_DEPLOY }}

      - name: Slack Notification (Failure)
        if: failure()
        uses: 8398a7/action-slack@v3
        with:
          status: custom
          custom_payload: |
            {
              "text": "🚨 Firebase Stage 자동 배포 실패",
              "blocks": [
                {
                  "type": "header",
                  "text": {"type": "plain_text", "text": "❌ Firebase Stage 배포 실패"}
                },
                {
                  "type": "section",
                  "fields": [
                    {"type": "mrkdwn", "text": "*Environment:*\nStage"},
                    {"type": "mrkdwn", "text": `*Branch:*\n${process.env.GITHUB_REF_NAME}`},
                    {"type": "mrkdwn", "text": `*Commit:*\n<https://github.com/${process.env.GITHUB_REPOSITORY}/commit/${process.env.GITHUB_SHA}|${process.env.GITHUB_SHA.substring(0, 7)}>`},
                    {"type": "mrkdwn", "text": `*Workflow:*\n<https://github.com/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}|View Logs>`}
                  ]
                },
                {
                  "type": "section",
                  "text": {"type": "mrkdwn", "text": "⚠️ *수동 개입 필요*\n에러 로그를 확인하고 수동으로 롤백하세요."}
                }
              ]
            }
          username: 'Firebase CI'
          icon_emoji: ':fire:'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL_DEPLOY }}
