openapi: 3.0.3
info:
  title: Promiso Firebase Functions API
  description: |
    iOS 앱과 Firebase Functions 간 통신 규격

    ## 환경 분리 (Environment Separation)

    **Firestore 경로가 환경별로 자동 분리됩니다:**

    | 환경 | Firestore 경로 | Functions Endpoint |
    |------|---------------|-------------------|
    | **Local** (Emulator) | `dev/root/groups/{id}` | `localhost:5001` |
    | **Stage** | `stage/root/groups/{id}` | `asia-northeast3-{projectId}.cloudfunctions.net` |
    | **Prod** | `prod/root/groups/{id}` | `asia-northeast3-{projectId}.cloudfunctions.net` |

    ### iOS 설정
    ```swift
    #if DEBUG
    // Local 환경: Emulator 사용
    FirestoreEnvironmentManager.shared.setEnvironment(.dev)
    Functions.functions().useEmulator(withHost: "localhost", port: 5001)
    #else
    // Stage/Prod 환경: Production 사용
    FirestoreEnvironmentManager.shared.setEnvironment(.stage) // or .release
    #endif
    ```

    ### Functions 설정
    환경은 다음 규칙으로 결정됩니다:
    - Emulator: `FUNCTIONS_EMULATOR=true` → Local(Dev) 경로
    - Production: 요청의 `env` 파라미터로 Stage/Prod 분기

    모든 API 호출은 환경에 관계없이 동일한 방식으로 사용 가능합니다.

  version: 2.0.0
  contact:
    name: Promiso Team

servers:
  - url: https://asia-northeast3-{projectId}.cloudfunctions.net
    description: Production (Seoul)
    variables:
      projectId:
        default: your-project-id
        description: Firebase Project ID

  - url: http://localhost:5001/{projectId}/asia-northeast3
    description: Local Emulator
    variables:
      projectId:
        default: your-project-id

tags:
  - name: User
    description: 사용자 관련 API
  - name: Settings
    description: 설정 관련 API
  - name: Group
    description: 그룹 관련 API
  - name: Promise
    description: 약속 관련 API
  - name: LiveActivity
    description: LiveActivity (실시간 위치 공유) 관련 API
  - name: Notification
    description: 푸시 알림 관련 API
  - name: Emoji
    description: 이모지 생성 API

paths:
  /createUser:
    post:
      tags:
        - User
      summary: 회원가입 (사용자 생성)
      description: |
        Firebase Auth 가입 후 Firestore에 사용자 정보를 생성합니다.

        **인증 필수**: Firebase Authentication 토큰 필요
      operationId: createUser
      security:
        - firebaseAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - data
              properties:
                data:
                  $ref: '#/components/schemas/CreateUserRequest'
            examples:
              basic:
                summary: 기본 사용자 생성 (이름 포함)
                value:
                  data:
                    name: 김성원
                    nickname: 성원
                    provider:
                      type: google
                      uid: "100163668057674322269"
                      email: kswen0203@gmail.com
              withoutName:
                summary: 이름 없이 생성 (nickname 사용)
                value:
                  data:
                    nickname: 성원
                    provider:
                      type: google
                      uid: "100163668057674322269"
                      email: kswen0203@gmail.com
      responses:
        '200':
          description: 사용자 생성 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    $ref: '#/components/schemas/CreateUserResponse'
              examples:
                success:
                  value:
                    result:
                      userId: sFeDJwqJbqScbSUp4Jz54MDlnFv1
                      createdAt: "2025-01-05T10:00:00Z"
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '409':
          description: 이미 존재하는 사용자
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FunctionsError'
              examples:
                alreadyExists:
                  value:
                    error:
                      code: already-exists
                      message: 이미 존재하는 사용자입니다

  /getUser:
    post:
      tags:
        - User
      summary: 사용자 정보 조회
      description: |
        특정 사용자의 정보를 조회합니다. userId를 생략하면 본인 정보를 조회합니다.

        **인증 필수**: Firebase Authentication 토큰 필요
      operationId: getUser
      security:
        - firebaseAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  $ref: '#/components/schemas/GetUserRequest'
            examples:
              self:
                summary: 본인 정보 조회
                value:
                  data: {}
              other:
                summary: 다른 사용자 조회
                value:
                  data:
                    userId: otherUserId
      responses:
        '200':
          description: 사용자 조회 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    $ref: '#/components/schemas/UserResponse'
              examples:
                withProfile:
                  value:
                    result:
                      userId: sFeDJwqJbqScbSUp4Jz54MDlnFv1
                      name: 김성원
                      nickname: 성원
                      email: kswen0203@gmail.com
                      profile:
                        url: https://storage.googleapis.com/.../profile.jpg
                        thumbUrl: https://storage.googleapis.com/.../thumb_profile.jpg
                        updatedAt: "2025-01-05T10:00:00Z"
                      metaData:
                        createdAt: "2024-12-19T10:00:00Z"
                        updatedAt: "2025-01-05T10:00:00Z"
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          description: 사용자를 찾을 수 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FunctionsError'
              examples:
                notFound:
                  value:
                    error:
                      code: not-found
                      message: 사용자를 찾을 수 없습니다

  /updateUser:
    post:
      tags:
        - User
      summary: 사용자 정보 수정
      description: |
        사용자의 기본 정보를 수정합니다. nickname만 수정 가능합니다.

        **인증 필수**: Firebase Authentication 토큰 필요
      operationId: updateUser
      security:
        - firebaseAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - data
              properties:
                data:
                  $ref: '#/components/schemas/UpdateUserRequest'
            examples:
              basic:
                summary: 닉네임 변경
                value:
                  data:
                    nickname: 새로운닉네임
      responses:
        '200':
          description: 사용자 정보 수정 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    $ref: '#/components/schemas/UpdateUserResponse'
              examples:
                success:
                  value:
                    result:
                      success: true
                      updatedAt: "2025-01-05T10:30:00Z"
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /uploadProfileImage:
    post:
      tags:
        - User
      summary: 프로필 이미지 업로드
      description: |
        프로필 이미지를 업로드하고 썸네일을 자동 생성합니다.

        **플로우**: iOS에서 먼저 Storage에 업로드 → 경로를 이 API에 전달

        **인증 필수**: Firebase Authentication 토큰 필요
      operationId: uploadProfileImage
      security:
        - firebaseAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - data
              properties:
                data:
                  $ref: '#/components/schemas/UploadProfileImageRequest'
            examples:
              basic:
                summary: 프로필 이미지 업로드
                value:
                  data:
                    imagePath: profile_images/sFeDJwqJbqScbSUp4Jz54MDlnFv1.jpg
      responses:
        '200':
          description: 프로필 이미지 업로드 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    $ref: '#/components/schemas/UploadProfileImageResponse'
              examples:
                success:
                  value:
                    result:
                      profile:
                        url: https://storage.googleapis.com/.../profile.jpg
                        updatedAt: "2025-01-05T10:00:00Z"
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /getUserSettings:
    post:
      tags:
        - Settings
      summary: 사용자 설정 조회
      description: |
        사용자의 설정 정보를 조회합니다.

        **인증 필수**: Firebase Authentication 토큰 필요
      operationId: getUserSettings
      security:
        - firebaseAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  type: object
            examples:
              basic:
                value:
                  data: {}
      responses:
        '200':
          description: 설정 조회 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    $ref: '#/components/schemas/UserSettingsResponse'
              examples:
                success:
                  value:
                    result:
                      notificationEnabled: true
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /updateUserSettings:
    post:
      tags:
        - Settings
      summary: 사용자 설정 수정
      description: |
        사용자의 설정을 수정합니다.

        **인증 필수**: Firebase Authentication 토큰 필요
      operationId: updateUserSettings
      security:
        - firebaseAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - data
              properties:
                data:
                  $ref: '#/components/schemas/UpdateUserSettingsRequest'
            examples:
              disableNotification:
                summary: 알림 비활성화
                value:
                  data:
                    notificationEnabled: false
      responses:
        '200':
          description: 설정 수정 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    $ref: '#/components/schemas/UpdateUserSettingsResponse'
              examples:
                success:
                  value:
                    result:
                      success: true
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /checkNicknameAvailable:
    post:
      tags:
        - User
      summary: 닉네임 중복 검사
      description: |
        닉네임이 이미 사용 중인지 확인합니다.

        **인증 필수**: Firebase Authentication 토큰 필요

        다른 사용자의 문서에 직접 접근하지 않고 Cloud Function을 통해 안전하게 검사합니다.
      operationId: checkNicknameAvailable
      security:
        - firebaseAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - data
              properties:
                data:
                  $ref: '#/components/schemas/CheckNicknameAvailableRequest'
            examples:
              basic:
                summary: 닉네임 중복 검사
                value:
                  data:
                    nickname: 새닉네임
                    env: stage

      responses:
        '200':
          description: 닉네임 검사 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    $ref: '#/components/schemas/CheckNicknameAvailableResponse'
              examples:
                available:
                  summary: 사용 가능한 닉네임
                  value:
                    result:
                      available: true
                      nickname: 새닉네임
                taken:
                  summary: 이미 사용 중인 닉네임
                  value:
                    result:
                      available: false
                      nickname: 새닉네임

        '400':
          description: 잘못된 파라미터
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FunctionsError'
              examples:
                invalidNickname:
                  value:
                    error:
                      code: invalid-argument
                      message: 닉네임은 2~20자여야 합니다

        '401':
          $ref: '#/components/responses/Unauthenticated'

  /createGroup:
    post:
      tags:
        - Group
      summary: 그룹 생성
      description: |
        새로운 그룹을 생성하고 초대 코드를 발급합니다.

        **인증 필수**: Firebase Authentication 토큰 필요

        **내부 동작**:
        - groups/{groupId} 문서 생성 (memberIds: [creatorId] 포함)
        - users/{creatorId} 문서의 groups Map에 추가 (서브컬렉션 → Map으로 변경)
        - 멤버 정보는 memberIds 배열로 관리 (users 컬렉션 참조)
        - imageUrl을 그대로 Firestore에 저장 (iOS에서 업로드 후 downloadURL 전달)
      operationId: createGroup
      security:
        - firebaseAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - data
              properties:
                data:
                  $ref: '#/components/schemas/CreateGroupRequest'
            examples:
              basic:
                summary: 기본 그룹 생성
                value:
                  data:
                    groupId: 0ec6e63d-8d80-4a76-9e1b-7f226c1c6b55
                    name: 주말 등산 모임
                    maxMembers: 5
                    env: stage
              withDescription:
                summary: 설명 포함
                value:
                  data:
                    groupId: 0ec6e63d-8d80-4a76-9e1b-7f226c1c6b55
                    name: 주말 등산 모임
                    maxMembers: 5
                    description: 주말마다 등산하는 모임입니다
              withImage:
                summary: 이미지 및 설명 포함
                value:
                  data:
                    groupId: 0ec6e63d-8d80-4a76-9e1b-7f226c1c6b55
                    name: 주말 등산 모임
                    maxMembers: 5
                    description: 주말마다 등산하는 모임입니다
                    imageUrl: https://firebasestorage.googleapis.com/v0/b/promiso-20274.firebasestorage.app/o/group_images%2F0ec6e63d-8d80-4a76-9e1b-7f226c1c6b55%2Fmain.jpg?alt=media

      responses:
        '200':
          description: 그룹 생성 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    $ref: '#/components/schemas/CreateGroupResponse'
              examples:
                success:
                  value:
                    result:
                      id: 0ec6e63d-8d80-4a76-9e1b-7f226c1c6b55
                      name: 주말 등산 모임
                      inviteCode: AB12CD

        '400':
          description: 잘못된 파라미터
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FunctionsError'
              examples:
                invalidName:
                  value:
                    error:
                      code: invalid-argument
                      message: 그룹 이름은 최소 2글자 이상이어야 합니다
                invalidMaxMembers:
                  value:
                    error:
                      code: invalid-argument
                      message: 최대 인원(maxMembers)은 2 이상이어야 합니다
                invalidEnv:
                  value:
                    error:
                      code: invalid-argument
                      message: env는 stage 또는 prod만 허용됩니다

        '401':
          description: 인증 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FunctionsError'
              examples:
                unauthenticated:
                  value:
                    error:
                      code: unauthenticated
                      message: 로그인이 필요합니다

        '500':
          description: 서버 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FunctionsError'
              examples:
                inviteCodeFailed:
                  value:
                    error:
                      code: internal
                      message: 초대 코드를 생성하지 못했어요. 잠시 후 다시 시도해주세요.

  /previewGroup:
    post:
      tags:
        - Group
      summary: 그룹 미리보기
      description: |
        초대 코드로 그룹 정보를 미리 확인합니다.

        **인증 불필요**: 초대 코드만으로 조회 가능
        **실제 참여하지 않음**: 그룹 정보만 조회하고 memberIds에 추가되지 않음
      operationId: previewGroup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - data
              properties:
                data:
                  $ref: '#/components/schemas/PreviewGroupRequest'
            examples:
              basic:
                summary: 그룹 미리보기
                value:
                  data:
                    inviteCode: ABC123
                    env: stage

      responses:
        '200':
          description: 그룹 미리보기 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    $ref: '#/components/schemas/PreviewGroupResponse'
              examples:
                success:
                  value:
                    result:
                      groupId: 0ec6e63d-8d80-4a76-9e1b-7f226c1c6b55
                      members:
                        - userId: user123
                          name: 홍길동
                          profileImage:
                            type: storagePath
                            url: users/user123/profile.jpg
                        - userId: user456
                          name: 김철수
                          profileImage: null

        '400':
          description: 잘못된 파라미터
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FunctionsError'
              examples:
                invalidCode:
                  value:
                    error:
                      code: invalid-argument
                      message: 초대 코드는 6자리여야 합니다

        '404':
          description: 그룹을 찾을 수 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FunctionsError'
              examples:
                groupNotFound:
                  value:
                    error:
                      code: not-found
                      message: 초대 코드에 해당하는 그룹을 찾을 수 없습니다

  /joinGroup:
    post:
      tags:
        - Group
      summary: 그룹 참여
      description: |
        초대 코드를 사용하여 기존 그룹에 참여합니다.

        **인증 필수**: Firebase Authentication 토큰 필요

        **내부 동작**:
        - inviteCode로 그룹 조회
        - memberIds 배열에 userId 추가 (FieldValue.arrayUnion)
        - users/{userId} 문서의 groups Map에 추가 (서브컬렉션 → Map으로 변경)
      operationId: joinGroup
      security:
        - firebaseAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - data
              properties:
                data:
                  $ref: '#/components/schemas/JoinGroupRequest'
            examples:
              basic:
                summary: 기본 그룹 참여
                value:
                  data:
                    inviteCode: ABC123
                    env: stage

      responses:
        '200':
          description: 그룹 참여 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    $ref: '#/components/schemas/JoinGroupResponse'
              examples:
                success:
                  value:
                    result:
                      groupId: 0ec6e63d-8d80-4a76-9e1b-7f226c1c6b55
                      groupName: 주말 등산 모임

        '400':
          description: 잘못된 파라미터
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FunctionsError'
              examples:
                invalidCode:
                  value:
                    error:
                      code: invalid-argument
                      message: 초대 코드는 6자리여야 합니다

        '401':
          description: 인증 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FunctionsError'
              examples:
                unauthenticated:
                  value:
                    error:
                      code: unauthenticated
                      message: 로그인이 필요합니다

        '404':
          description: 그룹을 찾을 수 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FunctionsError'
              examples:
                groupNotFound:
                  value:
                    error:
                      code: not-found
                      message: 초대 코드에 해당하는 그룹을 찾을 수 없습니다

        '409':
          description: 이미 참여한 그룹
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FunctionsError'
              examples:
                alreadyMember:
                  value:
                    error:
                      code: already-exists
                      message: 이미 참여한 그룹입니다

        '429':
          description: 그룹 정원 초과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FunctionsError'
              examples:
                groupFull:
                  value:
                    error:
                      code: resource-exhausted
                      message: 그룹 정원이 초과되었습니다

  /leaveGroup:
    post:
      tags:
        - Group
      summary: 그룹 나가기
      description: |
        참여 중인 그룹에서 나갑니다.

        **인증 필수**: Firebase Authentication 토큰 필요
