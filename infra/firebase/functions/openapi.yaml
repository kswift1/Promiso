    # ========================================
    # Firestore Document Schemas
    # ========================================

    GroupDocument:
      type: object
      description: |
        Firestore groups/{groupId} 문서 구조

        **멤버 관리 방식**: memberIds 배열
        - 멤버 정보는 users 컬렉션에서 직접 조회
        - members 서브컬렉션 없음 (캐시 동기화 불필요)
        - 항상 최신 사용자 정보 보장
        - memberCount는 memberIds.length로 실시간 계산
      required:
        - name
        - memberIds
        - maxMembers
        - inviteCode
        - createdBy
        - createdAt
        - updatedAt
      properties:
        name:
          type: string
          description: 그룹 이름
          example: 주말 등산 모임
        description:
          type: string
          nullable: true
          description: 그룹 설명
          example: 주말마다 등산하는 모임입니다
        imageUrl:
          type: string
          nullable: true
          description: 그룹 이미지 URL
          example: https://firebasestorage.googleapis.com/v0/b/promiso-20274.firebasestorage.app/o/group_images%2Fabc123%2Fmain.jpg?alt=media
        memberIds:
          type: array
          items:
            type: string
          description: 멤버 ID 목록 (users 컬렉션 참조)
          example: ["user1", "user2", "user3"]
        maxMembers:
          type: integer
          description: 최대 인원
          example: 10
        inviteCode:
          type: string
          description: 초대 코드 (6자리)
          example: AB12CD
        createdBy:
          type: string
          description: 생성자 UID
          example: sFeDJwqJbqScbSUp4Jz54MDlnFv1
        createdAt:
          type: string
          format: date-time
          description: 생성 시각
        updatedAt:
          type: string
          format: date-time
          description: 수정 시각

    # ========================================
    # User Document Schema
    # ========================================

    UserDocument:
      type: object
      description: |
        Firestore users/{userId} 문서 구조

        **그룹 목록 관리 방식**: groups Map
        - 기존: users/{userId}/groups/{groupId} 서브컬렉션 → N회 읽기
        - 변경: users/{userId} 문서 내 groups Map → 1회 읽기
        - 사용자가 10개 그룹에 속해도 1회 읽기로 모든 그룹 정보 조회
        - 읽기 비용 90% 절감 (10개 그룹 기준)
      properties:
        name:
          type: string
          description: 사용자 이름 (provider에서 받은 이름)
          example: 김성원
        nickname:
          type: string
          description: 사용자 닉네임
          example: 성원
        profile:
          type: object
          nullable: true
          description: 프로필 이미지 정보
          required:
            - url
            - updatedAt
          properties:
            url:
              type: string
              format: uri
              description: 원본 이미지 URL
              example: https://storage.googleapis.com/.../profile.jpg
            thumbUrl:
              type: string
              format: uri
              nullable: true
              description: 썸네일 URL
              example: https://storage.googleapis.com/.../thumb_profile.jpg
            updatedAt:
              type: string
              format: date-time
              description: 업데이트 시각
              example: "2025-01-05T10:00:00Z"
        metaData:
          type: object
          description: 메타데이터
          required:
            - createdAt
            - updatedAt
          properties:
            createdAt:
              type: string
              format: date-time
              description: 생성 시각
              example: "2024-12-19T10:00:00Z"
            updatedAt:
              type: string
              format: date-time
              description: 수정 시각
              example: "2025-01-05T10:00:00Z"
        devices:
          type: object
          nullable: true
          description: 디바이스 정보 Map (deviceId → DeviceInfo)
          additionalProperties:
            type: object
            properties:
              fcmToken:
                type: string
                description: FCM 토큰
              platform:
                type: string
                description: 플랫폼 (ios | android)
              lastActiveAt:
                type: string
                format: date-time
                description: 마지막 활성 시각
              createdAt:
                type: string
                format: date-time
                description: 토큰 등록 시각
              liveActivityPushToStartToken:
                type: string
                nullable: true
                description: LiveActivity Push to Start 토큰
              liveActivityPushToken:
                type: string
                nullable: true
                description: LiveActivity Push 토큰
        groups:
          type: object
          description: 그룹 목록 (groupId를 키로 하는 Map)
          additionalProperties:
            $ref: '#/components/schemas/UserGroupInfo'
          example:
            "groupId1":
              groupName: 주말 등산 모임
              role: admin
              joinedAt: "2024-01-01T00:00:00Z"
              notifications:
                enabled: true
                promise:
                  invitation: true
                  reminder: true
                  confirmed: true
                  cancelled: true
                  updated: true
                  attendanceResponse: true
                group:
                  update: true
              hasNewActivity: false
              imageUrl: null
            "groupId2":
              groupName: 회사 동료
              role: member
              joinedAt: "2024-01-15T00:00:00Z"
              notifications:
                enabled: true
                promise:
                  invitation: false
                  reminder: true
                  confirmed: true
                  cancelled: true
                  updated: true
                  attendanceResponse: true
                group:
                  update: true
              hasNewActivity: true
              imageUrl: https://firebasestorage.googleapis.com/...

    UserGroupInfo:
      type: object
      description: 사용자별 그룹 정보
      required:
        - groupName
        - role
        - joinedAt
        - notifications
        - hasNewActivity
      properties:
        groupName:
          type: string
          description: 그룹 이름 (캐시)
          example: 주말 등산 모임
        role:
          type: string
          description: 사용자 역할
          enum:
            - admin
            - member
          example: admin
        joinedAt:
          type: string
          format: date-time
          description: 그룹 가입 시각
        notifications:
          $ref: '#/components/schemas/GroupNotificationSettings'
        hasNewActivity:
          type: boolean
          description: 새 활동 여부 (배지용)
          example: false
        imageUrl:
          type: string
          nullable: true
          description: 그룹 이미지 URL

    GroupNotificationSettings:
      type: object
      description: 그룹 알림 상세 설정
      required:
        - enabled
      properties:
        enabled:
          type: boolean
          description: 그룹 알림 전체 ON/OFF
          example: true
        promise:
          type: object
          nullable: true
          description: 약속 관련 알림 설정
          additionalProperties:
            type: boolean
        group:
          type: object
          nullable: true
          description: 그룹 관련 알림 설정
          additionalProperties:
            type: boolean
          example: https://firebasestorage.googleapis.com/...

    # ========================================
    # Promise Document Schema
    # ========================================

    PromiseDocument:
      type: object
      description: |
        Firestore promises/{promiseId} 문서 구조

        **투표 관리 방식**: votes Map
        - attendances 서브컬렉션 제거
        - votes.accepted: 참여 확정한 userId 배열
        - votes.declined: 참여 불가한 userId 배열
        - votes.until: 투표 마감 시각 (기본값: startAt)
        - pending: memberIds - accepted - declined (계산)

        **상태 계산 (클라이언트)**:
        - isConfirmed: votes.accepted.count >= minimumParticipants
        - isPast: endAt < now 또는 startAt < now
      required:
        - title
        - hostId
        - groupId
        - minimumParticipants
        - votes
        - startAt
        - createdAt
        - updatedAt
      properties:
        title:
          type: string
          description: 약속 제목
          example: 영화 관람
        emoji:
          type: string
          nullable: true
          description: 약속 이모지
          example: "🍿"
        description:
          type: string
          nullable: true
          description: 약속 설명
          example: 마블 신작 보러 가기
        hostId:
          type: string
          description: 호스트 ID
          example: user_kim123
        groupId:
          type: string
          description: 그룹 ID
          example: group_friends
        minimumParticipants:
          type: integer
          minimum: 1
          description: 최소 참가자 수 (확정 기준)
          example: 1
        votes:
          type: object
          description: 투표 정보 (상태별 userId 배열 + 마감 시각)
          required:
            - accepted
            - declined
            - until
          properties:
            accepted:
              type: array
              items:
                type: string
              description: 참여 확정한 userId 목록
              example: ["user_kim123", "user_lee456"]
            declined:
              type: array
              items:
                type: string
              description: 참여 불가한 userId 목록
              example: ["user_park789"]
            until:
              type: string
              format: date-time
              description: "투표 마감 시각 (기본값: startAt)"
              example: "2024-01-15T19:00:00+09:00"
        startAt:
          type: string
          format: date-time
          description: 시작 시각
        endAt:
          type: string
          format: date-time
          nullable: true
          description: 종료 시각
        location:
          type: object
          nullable: true
          description: 장소 정보
          properties:
            name:
              type: string
              description: 장소명
              example: CGV 강남
            address:
              type: string
              nullable: true
              description: 주소
              example: 서울 강남구 강남대로 438
            latitude:
              type: number
              nullable: true
              description: 위도
              example: 37.501087
            longitude:
              type: number
              nullable: true
              description: 경도
              example: 127.026632
        trackingStartMinutesBefore:
          type: integer
          nullable: true
          description: LiveActivity 시작 시간 (약속 N분 전)
          example: 30
        liveActivityScheduled:
          type: boolean
          nullable: true
          description: LiveActivity 예약 완료 여부
          example: false
        liveActivityScheduledAt:
          type: string
          format: date-time
          nullable: true
          description: LiveActivity 예약 시각
        createdAt:
          type: string
          format: date-time
          description: 생성 시각
        updatedAt:
          type: string
          format: date-time
          description: 수정 시각

    # ========================================
    # createPromise
    # ========================================

    CreatePromiseRequest:
      type: object
      required:
        - groupId
        - title
        - startAt
        - minimumParticipants
      properties:
        groupId:
          type: string
          description: 약속을 생성할 그룹 ID
          example: 0ec6e63d-8d80-4a76-9e1b-7f226c1c6b55

        title:
          type: string
          minLength: 1
          description: 약속 제목
          example: 주말 등산

        emoji:
          type: string
          nullable: true
          description: 약속 이모지 (선택적)
          example: "🏔️"

        description:
          type: string
          nullable: true
          description: 약속 설명 (선택적)
          example: 북한산 백운대 등반

        startAt:
          type: string
          format: date-time
          description: 시작 시간 (ISO 8601 문자열)
          example: "2024-12-25T10:00:00+09:00"

        endAt:
          type: string
          format: date-time
          nullable: true
          description: 종료 시간 (선택적, ISO 8601 문자열)
          example: "2024-12-25T16:00:00+09:00"

        minimumParticipants:
          type: integer
          minimum: 1
          description: 최소 참가 인원
          example: 3

        location:
          type: object
          nullable: true
          description: 장소 정보 (선택적)
          properties:
            name:
              type: string
              description: 장소 이름
              example: 북한산 백운대 입구
            address:
              type: string
              nullable: true
              description: 주소
              example: 경기도 고양시 덕양구 북한동
            latitude:
              type: number
              format: double
              nullable: true
              description: 위도
              example: 37.6594
            longitude:
              type: number
              format: double
              nullable: true
              description: 경도
              example: 126.9778

        arrivalSharingTime:
          type: integer
          nullable: true
          description: 도착 상황 공유 시작 시간 (분 단위, 선택적)
          example: 30

        env:
          type: string
          enum:
            - stage
            - prod
          description: 환경 구분 (선택적)
          example: stage

    CreatePromiseResponse:
      type: object
      required:
        - promiseId
        - title
        - groupId
        - startAt
      properties:
        promiseId:
          type: string
          description: 생성된 약속 ID
          example: xyz789abc123

        title:
          type: string
          description: 약속 제목
          example: 주말 등산

        groupId:
          type: string
          description: 그룹 ID
          example: 0ec6e63d-8d80-4a76-9e1b-7f226c1c6b55

        startAt:
          type: object
          description: 시작 시간 (Firebase Timestamp)
          properties:
            _seconds:
              type: integer
              description: Unix timestamp (초)
              example: 1735084800
            _nanoseconds:
              type: integer
              description: Nanoseconds
              example: 0

    RespondPromiseRequest:
      type: object
      required:
        - promiseId
        - status
      properties:
        promiseId:
          type: string
          description: 약속 ID
          example: promise_abc123

        status:
          type: string
          enum:
            - accepted
            - declined
            - pending
          description: 응답 상태 (accepted=참여, declined=참여불가, pending=미정)
          example: accepted

        env:
          type: string
          enum:
            - stage
            - prod
          description: 환경 구분 (선택적)
          example: stage

    RespondPromiseResponse:
      type: object
      required:
        - promiseId
        - status
      properties:
        promiseId:
          type: string
          description: 약속 ID
          example: promise_abc123

        status:
          type: string
          enum:
            - accepted
            - declined
            - pending
          description: 응답 상태 (accepted=참여, declined=참여불가, pending=미정)
          example: accepted

    # ========================================
    # updatePromise
    # ========================================

    UpdatePromiseRequest:
      type: object
      required:
        - promiseId
      properties:
        promiseId:
          type: string
          description: 수정할 약속 ID
          example: promise_abc123

        title:
          type: string
          nullable: true
          minLength: 1
          description: 약속 제목 (선택적)
          example: 주말 등산

        emoji:
          type: string
          nullable: true
          description: 약속 이모지 (선택적, null이면 제거)
          example: "🏔️"

        description:
          type: string
          nullable: true
          description: 약속 설명 (선택적, null이면 제거)
          example: 북한산 백운대 등반

        startAt:
          type: string
          format: date-time
          nullable: true
          description: 시작 시간 (선택적, ISO 8601 문자열)
          example: "2024-12-25T10:00:00+09:00"

        endAt:
          type: string
          format: date-time
          nullable: true
          description: 종료 시간 (선택적, null이면 제거)
          example: "2024-12-25T16:00:00+09:00"

        minimumParticipants:
          type: integer
          minimum: 1
          nullable: true
          description: 최소 참가 인원 (선택적)
          example: 3

        env:
          type: string
          enum:
            - stage
            - prod
          description: 환경 구분 (선택적)
          example: stage

    UpdatePromiseResponse:
      type: object
      required:
        - success
      properties:
        success:
          type: boolean
          description: 수정 성공 여부
          example: true

    # ========================================
    # Notification
    # ========================================

    NotificationType:
      type: string
      description: 알림 타입
      enum:
        - promise_invitation
        - promise_reminder
        - promise_confirmed
        - promise_cancelled
        - promise_updated
        - group_invitation
        - group_update
        - attendance_response
        - system
      example: promise_invitation

    SendPushNotificationRequest:
      type: object
      required:
        - userIds
        - type
        - title
        - body
      properties:
        userIds:
          type: array
          items:
            type: string
          description: 수신자 ID 배열
          example: ["user123", "user456"]

        type:
          $ref: '#/components/schemas/NotificationType'

        title:
          type: string
          description: 알림 제목
          example: "대학 친구들에 새 약속"

        body:
          type: string
          description: 알림 본문
          example: "성원님이 \"영화 관람\" 약속을 만들었어요"

        promiseId:
          type: string
          nullable: true
          description: 관련 약속 ID (선택적)
          example: "promise_abc123"

        groupId:
          type: string
          nullable: true
          description: 관련 그룹 ID (선택적)
          example: "group_xyz"

        relatedUserId:
          type: string
          nullable: true
          description: 관련 사용자 ID (선택적)
          example: "user_sungwon"

        data:
          type: object
          nullable: true
          additionalProperties:
            type: string
          description: 추가 데이터 (선택적)
          example: { "key": "value" }

        env:
          type: string
          enum:
            - stage
            - prod
          nullable: true
          description: 환경 구분 (선택적)
          example: stage

    SendPushNotificationResponse:
      type: object
      required:
        - success
        - successCount
        - failureCount
      properties:
        success:
          type: boolean
          description: 전송 성공 여부
          example: true

        successCount:
          type: integer
          description: 성공한 전송 수
          example: 2

        failureCount:
          type: integer
          description: 실패한 전송 수
          example: 0

    NotificationDocument:
      type: object
      description: |
        Firestore notifications/{notificationId} 문서 구조

        푸시 알림 전송 시 자동 생성됩니다.
      required:
        - userId
        - type
        - title
        - body
        - isRead
        - isDelivered
        - createdAt
      properties:
        userId:
          type: string
          description: 수신자 ID
          example: user_kim123

        type:
          $ref: '#/components/schemas/NotificationType'

        title:
          type: string
          description: 알림 제목
          example: "대학 친구들에 새 약속"

        body:
          type: string
          description: 알림 본문
          example: "성원님이 \"영화 관람\" 약속을 만들었어요"

        promiseId:
          type: string
          nullable: true
          description: 관련 약속 ID
          example: promise_abc123

        groupId:
          type: string
          nullable: true
          description: 관련 그룹 ID
          example: group_xyz

        relatedUserId:
          type: string
          nullable: true
          description: 관련 사용자 ID
          example: user_sungwon

        isRead:
          type: boolean
          description: 읽음 여부
          example: false

        isDelivered:
          type: boolean
          description: FCM 전송 성공 여부
          example: true

        createdAt:
          type: string
          format: date-time
          description: 생성 시각

        readAt:
          type: string
          format: date-time
          nullable: true
          description: 읽은 시각

        deliveredAt:
          type: string
          format: date-time
          nullable: true
          description: FCM 전송 시각

        data:
          type: object
          nullable: true
          additionalProperties:
            type: string
          description: 추가 데이터

    # ========================================
    # LiveActivity
    # ========================================

    RegisterPushToStartTokenRequest:
      type: object
      required:
        - token
        - deviceId
      properties:
        token:
          type: string
          description: Push to Start 토큰 (APNs)
          example: "abc123def456..."

        deviceId:
          type: string
          description: 디바이스 고유 ID (UUID)
          example: "device-uuid-1234"

        env:
          type: string
          enum:
            - stage
            - prod
          nullable: true
          description: 환경 구분

    RegisterPushToStartTokenResponse:
      type: object
      required:
        - success
      properties:
        success:
          type: boolean
          description: 등록 성공 여부
          example: true

    StartLiveActivityRequest:
      type: object
      required:
        - promiseId
      properties:
        promiseId:
          type: string
          description: 약속 ID
          example: "promise_abc123"

        env:
          type: string
          enum:
            - stage
            - prod
          nullable: true
          description: 환경 구분

    StartLiveActivityResponse:
      type: object
      required:
        - success
        - successCount
        - failureCount
      properties:
        success:
          type: boolean
          description: 전송 성공 여부
          example: true

        successCount:
          type: integer
          description: 전송 성공 수
          example: 3

        failureCount:
          type: integer
          description: 전송 실패 수
          example: 0

    UpdateETARequest:
      type: object
      required:
        - promiseId
        - estimatedMinutes
      properties:
        promiseId:
          type: string
          description: 약속 ID
          example: "promise_abc123"

        estimatedMinutes:
          type: integer
          minimum: 0
          description: |
            도착 예상 시간 (분)
            - 0: 도착
            - 5, 10, 15, 30: N분 후 도착
          example: 5

        env:
          type: string
          enum:
            - stage
            - prod
          nullable: true
          description: 환경 구분

    UpdateETAResponse:
      type: object
      required:
        - success
        - successCount
        - failureCount
      properties:
        success:
          type: boolean
          description: 전송 성공 여부
          example: true

        successCount:
          type: integer
          description: 전송 성공 수
          example: 3

        failureCount:
          type: integer
          description: 전송 실패 수
          example: 0

    WidgetUpdateETARequest:
      type: object
      required:
        - channelId
        - participants
      properties:
        channelId:
          type: string
          description: APNs Broadcast 채널 ID
          example: "ch_abc123"

        participants:
          type: array
          items:
            $ref: '#/components/schemas/LiveActivityParticipant'
          description: 전체 참가자 상태

        trackingDurationMinutes:
          type: integer
          nullable: true
          description: LiveActivity 추적 시간 (분)
          example: 30

        env:
          type: string
          enum:
            - stage
            - prod
          nullable: true
          description: 환경 구분

    WidgetUpdateETAResponse:
      type: object
      required:
        - success
      properties:
        success:
          type: boolean
          description: 전송 성공 여부
          example: true

        error:
          type: string
          nullable: true
          description: 오류 메시지 (실패 시)
          example: null

    LiveActivityParticipant:
      type: object
      required:
        - id
        - name
        - estimatedArrivalMinutes
      properties:
        id:
          type: string
          description: 참가자 userId
          example: "user_kim123"

        name:
          type: string
          description: 참가자 표시 이름
          example: "김민수"

        estimatedArrivalMinutes:
          type: integer
          nullable: true
          description: |
            도착 예상 시간 (분)
            - null: 대기 (아직 입력 안함)
            - 0: 도착
            - N: N분 후 도착
          example: 5

    # ========================================
    # Error
    # ========================================

    FunctionsError:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              enum:
                - unauthenticated
                - invalid-argument
                - permission-denied
                - not-found
                - already-exists
                - resource-exhausted
                - failed-precondition
                - internal
                - unavailable
                - deadline-exceeded
              description: Firebase Functions 에러 코드
              example: invalid-argument

            message:
              type: string
              description: 에러 메시지
              example: 그룹 이름은 최소 2글자 이상이어야 합니다

            details:
              type: object
              description: 추가 에러 정보 (선택적)
              additionalProperties: true
