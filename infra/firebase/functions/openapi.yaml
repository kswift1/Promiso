    post:
      tags:
        - Notification
      summary: 푸시 알림 전송
      description: |
        지정된 사용자들에게 푸시 알림을 전송합니다.

        **인증 필수**: Firebase Authentication 토큰 필요

        **내부 동작**:
        - 각 사용자의 devices Map에서 FCM 토큰 조회
        - FCM 멀티캐스트로 푸시 알림 전송
        - notifications 컬렉션에 알림 기록 저장

        > 💡 **참고**: 일반적으로 Firestore 트리거(onPromiseCreated 등)가 자동으로 푸시를 전송합니다.
        > 이 API는 수동 알림 전송이 필요한 경우에 사용합니다.
      operationId: sendPushNotification
      security:
        - firebaseAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - data
              properties:
                data:
                  $ref: '#/components/schemas/SendPushNotificationRequest'
            examples:
              promiseInvitation:
                summary: 약속 초대 알림
                value:
                  data:
                    userIds: ["user123", "user456"]
                    type: promise_invitation
                    title: "대학 친구들에 새 약속"
                    body: "성원님이 \"영화 관람\" 약속을 만들었어요"
                    promiseId: "promise_abc123"
                    groupId: "group_xyz"
                    relatedUserId: "user_sungwon"
                    env: stage
              systemNotification:
                summary: 시스템 알림
                value:
                  data:
                    userIds: ["user123"]
                    type: system
                    title: "공지사항"
                    body: "새로운 기능이 추가되었습니다!"
                    env: stage

      responses:
        '200':
          description: 푸시 알림 전송 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    $ref: '#/components/schemas/SendPushNotificationResponse'
              examples:
                success:
                  value:
                    result:
                      success: true
                      successCount: 2
                      failureCount: 0
                partialSuccess:
                  value:
                    result:
                      success: true
                      successCount: 1
                      failureCount: 1

        '400':
          description: 잘못된 파라미터
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FunctionsError'
              examples:
                missingUserIds:
                  value:
                    error:
                      code: invalid-argument
                      message: 수신자 ID 배열은 필수입니다
                missingFields:
                  value:
                    error:
                      code: invalid-argument
                      message: 알림 타입, 제목, 본문은 필수입니다

        '401':
          $ref: '#/components/responses/Unauthenticated'

        '500':
          description: 서버 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FunctionsError'
              examples:
                internal:
                  value:
                    error:
                      code: internal
                      message: 푸시 알림 전송 중 오류가 발생했습니다

