openapi: 3.0.3
info:
  title: Promiso Firebase Functions API
  description: |
    iOS 앱과 Firebase Functions 간 통신 규격

    ## 환경 분리 (Environment Separation)

    **Firestore 경로가 환경별로 자동 분리됩니다:**

    | 환경 | Firestore 경로 | Functions Endpoint |
    |------|---------------|-------------------|
    | **Local** (Emulator) | `dev/root/groups/{id}` | `localhost:5001` |
    | **Stage** | `stage/root/groups/{id}` | `asia-northeast3-{projectId}.cloudfunctions.net` |
    | **Prod** | `prod/root/groups/{id}` | `asia-northeast3-{projectId}.cloudfunctions.net` |

    ### iOS 설정
    ```swift
    #if DEBUG
    // Local 환경: Emulator 사용
    FirestoreEnvironmentManager.shared.setEnvironment(.dev)
    Functions.functions().useEmulator(withHost: "localhost", port: 5001)
    #else
    // Stage/Prod 환경: Production 사용
    FirestoreEnvironmentManager.shared.setEnvironment(.stage) // or .release
    #endif
    ```

    ### Functions 설정
    환경은 다음 규칙으로 결정됩니다:
    - Emulator: `FUNCTIONS_EMULATOR=true` → Local(Dev) 경로
    - Production: 요청의 `env` 파라미터로 Stage/Prod 분기

    모든 API 호출은 환경에 관계없이 동일한 방식으로 사용 가능합니다.

  version: 2.0.0
  contact:
    name: Promiso Team

servers:
  - url: https://asia-northeast3-{projectId}.cloudfunctions.net
    description: Production (Seoul)
    variables:
      projectId:
        default: your-project-id
        description: Firebase Project ID

  - url: http://localhost:5001/{projectId}/asia-northeast3
    description: Local Emulator
    variables:
      projectId:
        default: your-project-id

tags:
  - name: User
    description: 사용자 관련 API
  - name: Settings
    description: 설정 관련 API
  - name: Group
    description: 그룹 관련 API
  - name: Promise
    description: 약속 관련 API
  - name: Test
    description: 테스트용 API

paths:
  /createUser:
    post:
      tags:
        - User
      summary: 회원가입 (사용자 생성)
      description: |
        Firebase Auth 가입 후 Firestore에 사용자 정보를 생성합니다.

        **인증 필수**: Firebase Authentication 토큰 필요
      operationId: createUser
      security:
        - firebaseAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - data
              properties:
                data:
                  $ref: '#/components/schemas/CreateUserRequest'
            examples:
              basic:
                summary: 기본 사용자 생성 (이름 포함)
                value:
                  data:
                    name: 김성원
                    nickname: 성원
                    provider:
                      type: google
                      uid: "100163668057674322269"
                      email: kswen0203@gmail.com
              withoutName:
                summary: 이름 없이 생성 (nickname 사용)
                value:
                  data:
                    nickname: 성원
                    provider:
                      type: google
                      uid: "100163668057674322269"
                      email: kswen0203@gmail.com
      responses:
        '200':
          description: 사용자 생성 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    $ref: '#/components/schemas/CreateUserResponse'
              examples:
                success:
                  value:
                    result:
                      userId: sFeDJwqJbqScbSUp4Jz54MDlnFv1
                      createdAt: "2025-01-05T10:00:00Z"
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '409':
          description: 이미 존재하는 사용자
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FunctionsError'
              examples:
                alreadyExists:
                  value:
                    error:
                      code: already-exists
                      message: 이미 존재하는 사용자입니다

  /getUser:
    post:
      tags:
        - User
      summary: 사용자 정보 조회
      description: |
        특정 사용자의 정보를 조회합니다. userId를 생략하면 본인 정보를 조회합니다.

        **인증 필수**: Firebase Authentication 토큰 필요
      operationId: getUser
      security:
        - firebaseAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  $ref: '#/components/schemas/GetUserRequest'
            examples:
              self:
                summary: 본인 정보 조회
                value:
                  data: {}
              other:
                summary: 다른 사용자 조회
                value:
                  data:
                    userId: otherUserId
      responses:
        '200':
          description: 사용자 조회 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    $ref: '#/components/schemas/UserResponse'
              examples:
                withProfile:
                  value:
                    result:
                      userId: sFeDJwqJbqScbSUp4Jz54MDlnFv1
                      name: 김성원
                      nickname: 성원
                      email: kswen0203@gmail.com
                      profile:
                        url: https://storage.googleapis.com/.../profile.jpg
                        thumbUrl: https://storage.googleapis.com/.../thumb_profile.jpg
                        updatedAt: "2025-01-05T10:00:00Z"
                      metaData:
                        createdAt: "2024-12-19T10:00:00Z"
                        updatedAt: "2025-01-05T10:00:00Z"
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          description: 사용자를 찾을 수 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FunctionsError'
              examples:
                notFound:
                  value:
                    error:
                      code: not-found
                      message: 사용자를 찾을 수 없습니다

  /updateUser:
    post:
      tags:
        - User
      summary: 사용자 정보 수정
      description: |
        사용자의 기본 정보를 수정합니다. nickname만 수정 가능합니다.

        **인증 필수**: Firebase Authentication 토큰 필요
      operationId: updateUser
      security:
        - firebaseAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - data
              properties:
                data:
                  $ref: '#/components/schemas/UpdateUserRequest'
            examples:
              basic:
                summary: 닉네임 변경
                value:
                  data:
                    nickname: 새로운닉네임
      responses:
        '200':
          description: 사용자 정보 수정 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    $ref: '#/components/schemas/UpdateUserResponse'
              examples:
                success:
                  value:
                    result:
                      success: true
                      updatedAt: "2025-01-05T10:30:00Z"
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /uploadProfileImage:
    post:
      tags:
        - User
      summary: 프로필 이미지 업로드
      description: |
        프로필 이미지를 업로드하고 썸네일을 자동 생성합니다.

        **플로우**: iOS에서 먼저 Storage에 업로드 → 경로를 이 API에 전달

        **인증 필수**: Firebase Authentication 토큰 필요
      operationId: uploadProfileImage
      security:
        - firebaseAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - data
              properties:
                data:
                  $ref: '#/components/schemas/UploadProfileImageRequest'
            examples:
              basic:
                summary: 프로필 이미지 업로드
                value:
                  data:
                    imagePath: profile_images/sFeDJwqJbqScbSUp4Jz54MDlnFv1.jpg
      responses:
        '200':
          description: 프로필 이미지 업로드 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    $ref: '#/components/schemas/UploadProfileImageResponse'
              examples:
                success:
                  value:
                    result:
                      profile:
                        url: https://storage.googleapis.com/.../profile.jpg
                        updatedAt: "2025-01-05T10:00:00Z"
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /getUserSettings:
    post:
      tags:
        - Settings
      summary: 사용자 설정 조회
      description: |
        사용자의 설정 정보를 조회합니다.

        **인증 필수**: Firebase Authentication 토큰 필요
      operationId: getUserSettings
      security:
        - firebaseAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  type: object
            examples:
              basic:
                value:
                  data: {}
      responses:
        '200':
          description: 설정 조회 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    $ref: '#/components/schemas/UserSettingsResponse'
              examples:
                success:
                  value:
                    result:
                      notificationEnabled: true
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /updateUserSettings:
    post:
      tags:
        - Settings
      summary: 사용자 설정 수정
      description: |
        사용자의 설정을 수정합니다.

        **인증 필수**: Firebase Authentication 토큰 필요
      operationId: updateUserSettings
      security:
        - firebaseAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - data
              properties:
                data:
                  $ref: '#/components/schemas/UpdateUserSettingsRequest'
            examples:
              disableNotification:
                summary: 알림 비활성화
                value:
                  data:
                    notificationEnabled: false
      responses:
        '200':
          description: 설정 수정 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    $ref: '#/components/schemas/UpdateUserSettingsResponse'
              examples:
                success:
                  value:
                    result:
                      success: true
        '400':
          $ref: '#/components/responses/InvalidArgument'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /createGroup:
    post:
      tags:
        - Group
      summary: 그룹 생성
      description: |
        새로운 그룹을 생성하고 초대 코드를 발급합니다.

        **인증 필수**: Firebase Authentication 토큰 필요

        **내부 동작**:
        - groups/{groupId} 문서 생성 (memberIds: [creatorId] 포함)
        - users/{creatorId} 문서의 groups Map에 추가 (서브컬렉션 → Map으로 변경)
        - 멤버 정보는 memberIds 배열로 관리 (users 컬렉션 참조)
        - imageUrl을 그대로 Firestore에 저장 (iOS에서 업로드 후 downloadURL 전달)
      operationId: createGroup
      security:
        - firebaseAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - data
              properties:
                data:
                  $ref: '#/components/schemas/CreateGroupRequest'
            examples:
              basic:
                summary: 기본 그룹 생성
                value:
                  data:
                    groupId: 0ec6e63d-8d80-4a76-9e1b-7f226c1c6b55
                    name: 주말 등산 모임
                    maxMembers: 5
                    env: stage
              withDescription:
                summary: 설명 포함
                value:
                  data:
                    groupId: 0ec6e63d-8d80-4a76-9e1b-7f226c1c6b55
                    name: 주말 등산 모임
                    maxMembers: 5
                    description: 주말마다 등산하는 모임입니다
              withImage:
                summary: 이미지 및 설명 포함
                value:
                  data:
                    groupId: 0ec6e63d-8d80-4a76-9e1b-7f226c1c6b55
                    name: 주말 등산 모임
                    maxMembers: 5
                    description: 주말마다 등산하는 모임입니다
                    imageUrl: https://firebasestorage.googleapis.com/v0/b/promiso-20274.firebasestorage.app/o/group_images%2F0ec6e63d-8d80-4a76-9e1b-7f226c1c6b55%2Fmain.jpg?alt=media

      responses:
        '200':
          description: 그룹 생성 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    $ref: '#/components/schemas/CreateGroupResponse'
              examples:
                success:
                  value:
                    result:
                      id: 0ec6e63d-8d80-4a76-9e1b-7f226c1c6b55
                      name: 주말 등산 모임
                      inviteCode: AB12CD

        '400':
          description: 잘못된 파라미터
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FunctionsError'
              examples:
                invalidName:
                  value:
                    error:
                      code: invalid-argument
                      message: 그룹 이름은 최소 2글자 이상이어야 합니다
                invalidMaxMembers:
                  value:
                    error:
                      code: invalid-argument
                      message: 최대 인원(maxMembers)은 2 이상이어야 합니다
                invalidEnv:
                  value:
                    error:
                      code: invalid-argument
                      message: env는 stage 또는 prod만 허용됩니다

        '401':
          description: 인증 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FunctionsError'
              examples:
                unauthenticated:
                  value:
                    error:
                      code: unauthenticated
                      message: 로그인이 필요합니다

        '500':
          description: 서버 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FunctionsError'
              examples:
                inviteCodeFailed:
                  value:
                    error:
                      code: internal
                      message: 초대 코드를 생성하지 못했어요. 잠시 후 다시 시도해주세요.

  /joinGroup:
    post:
      tags:
        - Group
      summary: 그룹 참여
      description: |
        초대 코드를 사용하여 기존 그룹에 참여합니다.

        **인증 필수**: Firebase Authentication 토큰 필요

        **내부 동작**:
        - inviteCode로 그룹 조회
        - memberIds 배열에 userId 추가 (FieldValue.arrayUnion)
        - users/{userId} 문서의 groups Map에 추가 (서브컬렉션 → Map으로 변경)
      operationId: joinGroup
      security:
        - firebaseAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - data
              properties:
                data:
                  $ref: '#/components/schemas/JoinGroupRequest'
            examples:
              basic:
                summary: 기본 그룹 참여
                value:
                  data:
                    inviteCode: ABC123
                    env: stage

      responses:
        '200':
          description: 그룹 참여 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    $ref: '#/components/schemas/JoinGroupResponse'
              examples:
                success:
                  value:
                    result:
                      groupId: 0ec6e63d-8d80-4a76-9e1b-7f226c1c6b55
                      groupName: 주말 등산 모임

        '400':
          description: 잘못된 파라미터
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FunctionsError'
              examples:
                invalidCode:
                  value:
                    error:
                      code: invalid-argument
                      message: 초대 코드는 6자리여야 합니다

        '401':
          description: 인증 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FunctionsError'
              examples:
                unauthenticated:
                  value:
                    error:
                      code: unauthenticated
                      message: 로그인이 필요합니다

        '404':
          description: 그룹을 찾을 수 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FunctionsError'
              examples:
                groupNotFound:
                  value:
                    error:
                      code: not-found
                      message: 초대 코드에 해당하는 그룹을 찾을 수 없습니다

        '409':
          description: 이미 참여한 그룹
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FunctionsError'
              examples:
                alreadyMember:
                  value:
                    error:
                      code: already-exists
                      message: 이미 참여한 그룹입니다

        '429':
          description: 그룹 정원 초과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FunctionsError'
              examples:
                groupFull:
                  value:
                    error:
                      code: resource-exhausted
                      message: 그룹 정원이 초과되었습니다

  /createPromise:
    post:
      tags:
        - Promise
      summary: 약속 생성
      description: |
        그룹 내에서 새로운 약속을 생성합니다.

        **인증 필수**: Firebase Authentication 토큰 필요
        **그룹 멤버십 필수**: 약속을 생성하려면 해당 그룹의 멤버여야 합니다
      operationId: createPromise
      security:
        - firebaseAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - data
              properties:
                data:
                  $ref: '#/components/schemas/CreatePromiseRequest'
            examples:
              basic:
                summary: 기본 약속 생성
                value:
                  data:
                    groupId: 0ec6e63d-8d80-4a76-9e1b-7f226c1c6b55
                    title: 주말 등산
                    startAt: "2024-12-25T10:00:00+09:00"
                    minimumParticipants: 3
                    env: stage
              withDetails:
                summary: 상세 정보 포함
                value:
                  data:
                    groupId: 0ec6e63d-8d80-4a76-9e1b-7f226c1c6b55
                    title: 주말 등산
                    emoji: "🏔️"
                    description: 북한산 백운대 등반
                    startAt: "2024-12-25T10:00:00+09:00"
                    endAt: "2024-12-25T16:00:00+09:00"
                    minimumParticipants: 3
                    place: 북한산 백운대 입구
                    arrivalSharingTime: 30
                    env: stage

      responses:
        '200':
          description: 약속 생성 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    $ref: '#/components/schemas/CreatePromiseResponse'
              examples:
                success:
                  value:
                    result:
                      promiseId: xyz789abc123
                      title: 주말 등산
                      groupId: 0ec6e63d-8d80-4a76-9e1b-7f226c1c6b55
                      startAt:
                        _seconds: 1735084800
                        _nanoseconds: 0

        '400':
          description: 잘못된 파라미터
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FunctionsError'
              examples:
                invalidTitle:
                  value:
                    error:
                      code: invalid-argument
                      message: 약속 제목은 필수입니다
                invalidMinimumParticipants:
                  value:
                    error:
                      code: invalid-argument
                      message: 최소 참가 인원은 2명 이상이어야 합니다
                invalidDate:
                  value:
                    error:
                      code: invalid-argument
                      message: 시작 시간은 ISO 8601 형식이어야 합니다

        '401':
          description: 인증 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FunctionsError'
              examples:
                unauthenticated:
                  value:
                    error:
                      code: unauthenticated
                      message: 로그인이 필요합니다

        '403':
          description: 권한 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FunctionsError'
              examples:
                notMember:
                  value:
                    error:
                      code: permission-denied
                      message: 그룹 멤버만 약속을 만들 수 있습니다

        '404':
          description: 그룹을 찾을 수 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FunctionsError'
              examples:
                groupNotFound:
                  value:
                    error:
                      code: not-found
                      message: 그룹을 찾을 수 없습니다

        '500':
          description: 서버 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FunctionsError'
              examples:
                internal:
                  value:
                    error:
                      code: internal
                      message: 약속 생성 중 오류가 발생했습니다

  /respondPromise:
    post:
      tags:
        - Promise
      summary: 약속 응답
      description: |
        약속 참석자 응답을 수락/거절로 업데이트합니다.
        votes.accepted 또는 votes.declined 배열에 userId를 추가/제거합니다.

        **인증 필수**: Firebase Authentication 토큰 필요
        **그룹 멤버만 가능**
      operationId: respondPromise
      security:
        - firebaseAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - data
              properties:
                data:
                  $ref: '#/components/schemas/RespondPromiseRequest'
            examples:
              accept:
                summary: 참여
                value:
                  data:
                    promiseId: promise_abc123
                    status: accepted
                    env: stage
              decline:
                summary: 참여불가
                value:
                  data:
                    promiseId: promise_abc123
                    status: declined
                    env: stage

      responses:
        '200':
          description: 약속 응답 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    $ref: '#/components/schemas/RespondPromiseResponse'
              examples:
                success:
                  value:
                    result:
                      promiseId: promise_abc123
                      status: accepted

        '400':
          description: 잘못된 파라미터
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FunctionsError'
              examples:
                invalidStatus:
                  value:
                    error:
                      code: invalid-argument
                      message: status는 accepted/declined 중 하나여야 합니다

        '401':
          description: 인증 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FunctionsError'
              examples:
                unauthenticated:
                  value:
                    error:
                      code: unauthenticated
                      message: 로그인이 필요합니다

        '403':
          description: 권한 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FunctionsError'
              examples:
                notMember:
                  value:
                    error:
                      code: permission-denied
                      message: 약속 참석자만 응답할 수 있습니다

        '404':
          description: 약속을 찾을 수 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FunctionsError'
              examples:
                promiseNotFound:
                  value:
                    error:
                      code: not-found
                      message: 약속을 찾을 수 없습니다

  /testCallable:
    post:
      tags:
        - Test
      summary: 테스트용 Callable Function
      description: Firebase Functions 연결을 테스트합니다.
      operationId: testCallable
      security:
        - firebaseAuth: []
        - {} # 인증 선택적
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  $ref: '#/components/schemas/TestCallableRequest'
            examples:
              withName:
                value:
                  data:
                    name: 홍길동
              noName:
                value:
                  data: {}

      responses:
        '200':
          description: 테스트 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    $ref: '#/components/schemas/TestCallableResponse'
              examples:
                authenticated:
                  value:
                    result:
                      message: Hello 홍길동!
                      authenticated: true
                      uid: abc123xyz
                guest:
                  value:
                    result:
                      message: Hello Guest!
                      authenticated: false
                      uid: null

components:
  securitySchemes:
    firebaseAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Firebase Authentication 토큰

  responses:
    Unauthenticated:
      description: 인증 실패
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/FunctionsError'
          examples:
            unauthenticated:
              value:
                error:
                  code: unauthenticated
                  message: 로그인이 필요합니다

    InvalidArgument:
      description: 잘못된 파라미터
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/FunctionsError'
          examples:
            invalidArgument:
              value:
                error:
                  code: invalid-argument
                  message: 잘못된 파라미터입니다

  schemas:
    # ========================================
    # User
    # ========================================

    CreateUserRequest:
      type: object
      required:
        - nickname
        - provider
      properties:
        name:
          type: string
          nullable: true
          description: provider에서 받은 이름 (선택적, null이면 nickname 사용)
          example: 김성원
        nickname:
          type: string
          minLength: 2
          maxLength: 12
          description: 사용자가 설정한 닉네임
          example: 성원
        provider:
          type: object
          required:
            - type
            - uid
            - email
          properties:
            type:
              type: string
              enum:
                - google
                - apple
              description: 인증 제공자 타입
              example: google
            uid:
              type: string
              description: 제공자 기준 사용자 ID
              example: "100163668057674322269"
            email:
              type: string
              format: email
              description: 제공자에서 받은 이메일
              example: kswen0203@gmail.com

    CreateUserResponse:
      type: object
      required:
        - userId
        - createdAt
      properties:
        userId:
          type: string
          description: 생성된 사용자 ID (Firebase Auth UID)
          example: sFeDJwqJbqScbSUp4Jz54MDlnFv1
        createdAt:
          type: string
          format: date-time
          description: 계정 생성 시각
          example: "2025-01-05T10:00:00Z"

    GetUserRequest:
      type: object
      properties:
        userId:
          type: string
          nullable: true
          description: 조회할 사용자 ID (생략 시 본인)
          example: otherUserId

    UserPublic:
      type: object
      description: 타인 조회 시 반환되는 사용자 정보 (이메일 제외)
      required:
        - userId
        - name
        - nickname
        - metaData
      properties:
        userId:
          type: string
          description: 사용자 ID
          example: sFeDJwqJbqScbSUp4Jz54MDlnFv1
        name:
          type: string
          description: provider에서 받은 이름
          example: 김성원
        nickname:
          type: string
          description: 사용자 설정 닉네임
          example: 성원
        profile:
          type: object
          nullable: true
          description: 프로필 이미지 정보
          required:
            - url
            - updatedAt
          properties:
            url:
              type: string
              format: uri
              description: 원본 이미지 URL
              example: https://storage.googleapis.com/.../profile.jpg
            thumbUrl:
              type: string
              format: uri
              nullable: true
              description: 썸네일 URL
              example: https://storage.googleapis.com/.../thumb_profile.jpg
            updatedAt:
              type: string
              format: date-time
              description: 업데이트 시각
              example: "2025-01-05T10:00:00Z"
        metaData:
          type: object
          required:
            - createdAt
            - updatedAt
          properties:
            createdAt:
              type: string
              format: date-time
              description: 생성 시각
              example: "2024-12-19T10:00:00Z"
            updatedAt:
              type: string
              format: date-time
              description: 수정 시각
              example: "2025-01-05T10:00:00Z"

    UserPrivate:
      type: object
      description: 본인 조회 시 반환되는 사용자 정보 (이메일 포함)
      required:
        - userId
        - name
        - nickname
        - email
        - provider
        - metaData
      properties:
        userId:
          type: string
          description: 사용자 ID
          example: sFeDJwqJbqScbSUp4Jz54MDlnFv1
        name:
          type: string
          description: provider에서 받은 이름
          example: 김성원
        nickname:
          type: string
          description: 사용자 설정 닉네임
          example: 성원
        email:
          type: string
          format: email
          description: 이메일 주소 (auth 서브컬렉션에서 조회)
          example: kswen0203@gmail.com
        provider:
          type: string
          description: 인증 제공자 타입 (auth 서브컬렉션에서 조회)
          example: google
        profile:
          type: object
          nullable: true
          description: 프로필 이미지 정보
          required:
            - url
            - updatedAt
          properties:
            url:
              type: string
              format: uri
              description: 원본 이미지 URL
              example: https://storage.googleapis.com/.../profile.jpg
            thumbUrl:
              type: string
              format: uri
              nullable: true
              description: 썸네일 URL
              example: https://storage.googleapis.com/.../thumb_profile.jpg
            updatedAt:
              type: string
              format: date-time
              description: 업데이트 시각
              example: "2025-01-05T10:00:00Z"
        metaData:
          type: object
          required:
            - createdAt
            - updatedAt
          properties:
            createdAt:
              type: string
              format: date-time
              description: 생성 시각
              example: "2024-12-19T10:00:00Z"
            updatedAt:
              type: string
              format: date-time
              description: 수정 시각
              example: "2025-01-05T10:00:00Z"

    UserResponse:
      oneOf:
        - $ref: '#/components/schemas/UserPublic'
        - $ref: '#/components/schemas/UserPrivate'
      description: |
        조건부 응답 스키마:
        - 본인 조회 시: UserPrivate (이메일 포함)
        - 타인 조회 시: UserPublic (이메일 제외)

    UpdateUserRequest:
      type: object
      properties:
        nickname:
          type: string
          minLength: 2
          maxLength: 12
          nullable: true
          description: 닉네임
          example: 새로운닉네임

    UpdateUserResponse:
      type: object
      required:
        - success
        - updatedAt
      properties:
        success:
          type: boolean
          description: 성공 여부
          example: true
        updatedAt:
          type: string
          format: date-time
          description: 수정 시각
          example: "2025-01-05T10:30:00Z"

    UploadProfileImageRequest:
      type: object
      required:
        - imagePath
      properties:
        imagePath:
          type: string
          description: Firebase Storage에 업로드된 이미지 경로
          example: profile_images/sFeDJwqJbqScbSUp4Jz54MDlnFv1.jpg

    UploadProfileImageResponse:
      type: object
      required:
        - profile
      properties:
        profile:
          type: object
          required:
            - url
            - updatedAt
          properties:
            url:
              type: string
              format: uri
              description: 원본 이미지 downloadURL
              example: https://storage.googleapis.com/.../profile.jpg
            updatedAt:
              type: string
              format: date-time
              description: 업데이트 시각
              example: "2025-01-05T10:00:00Z"

    # ========================================
    # Settings
    # ========================================

    UserSettingsResponse:
      type: object
      required:
        - notificationEnabled
      properties:
        notificationEnabled:
          type: boolean
          description: 알림 활성화 여부
          example: true

    UpdateUserSettingsRequest:
      type: object
      properties:
        notificationEnabled:
          type: boolean
          nullable: true
          description: 알림 활성화 여부
          example: false

    UpdateUserSettingsResponse:
      type: object
      required:
        - success
      properties:
        success:
          type: boolean
          description: 성공 여부
          example: true

    # ========================================
    # Group
    # ========================================

    CreateGroupRequest:
      type: object
      required:
        - groupId
        - name
        - maxMembers
      properties:
        groupId:
          type: string
          description: 클라이언트에서 생성한 그룹 ID
          example: 0ec6e63d-8d80-4a76-9e1b-7f226c1c6b55

        name:
          type: string
          minLength: 2
          description: 그룹 이름
          example: 주말 등산 모임

        maxMembers:
          type: integer
          minimum: 2
          description: 최대 인원
          example: 5

        env:
          type: string
          enum:
            - stage
            - prod
          description: 환경 구분 (선택적)
          example: stage

        description:
          type: string
          nullable: true
          description: 그룹 설명 (선택적)
          example: 주말마다 등산하는 모임입니다

        imageUrl:
          type: string
          nullable: true
          description: 그룹 이미지 다운로드 URL (선택적)
          example: https://firebasestorage.googleapis.com/v0/b/promiso-20274.firebasestorage.app/o/group_images%2Fabc123%2Fmain.jpg?alt=media

    CreateGroupResponse:
      type: object
      required:
        - id
        - name
        - inviteCode
      properties:
        id:
          type: string
          description: 생성된 그룹 ID (Firestore Document ID)
          example: xYz9Abc123Def456

        name:
          type: string
          description: 그룹 이름
          example: 주말 등산 모임

        inviteCode:
          type: string
          pattern: ^[A-Z0-9]{6}$
          description: 초대 코드 (6자리 영숫자)
          example: AB12CD

    # ========================================
    # joinGroup
    # ========================================

    JoinGroupRequest:
      type: object
      required:
        - inviteCode
      properties:
        inviteCode:
          type: string
          pattern: ^[A-Z0-9]{6}$
          description: 6자리 초대 코드
          example: ABC123

        env:
          type: string
          enum:
            - stage
            - prod
          description: 환경 구분 (선택적)
          example: stage

        userId:
          type: string
          description: 참여하려는 사용자 ID (내부적으로 auth.uid 사용, 검증용)
          example: user123

    JoinGroupResponse:
      type: object
      required:
        - groupId
        - groupName
      properties:
        groupId:
          type: string
          description: 참여한 그룹 ID
          example: 0ec6e63d-8d80-4a76-9e1b-7f226c1c6b55

        groupName:
          type: string
          description: 그룹 이름
          example: 주말 등산 모임

    # ========================================
    # Firestore Document Schemas
    # ========================================

    GroupDocument:
      type: object
      description: |
        Firestore groups/{groupId} 문서 구조

        **멤버 관리 방식**: memberIds 배열
        - 멤버 정보는 users 컬렉션에서 직접 조회
        - members 서브컬렉션 없음 (캐시 동기화 불필요)
        - 항상 최신 사용자 정보 보장
        - memberCount는 memberIds.length로 실시간 계산
      required:
        - name
        - memberIds
        - activePromiseCount
        - maxMembers
        - inviteCode
        - createdBy
        - createdAt
        - updatedAt
        - isDeleted
      properties:
        name:
          type: string
          description: 그룹 이름
          example: 주말 등산 모임
        description:
          type: string
          nullable: true
          description: 그룹 설명
          example: 주말마다 등산하는 모임입니다
        imageUrl:
          type: string
          nullable: true
          description: 그룹 이미지 URL
          example: https://firebasestorage.googleapis.com/v0/b/promiso-20274.firebasestorage.app/o/group_images%2Fabc123%2Fmain.jpg?alt=media
        memberIds:
          type: array
          items:
            type: string
          description: 멤버 ID 목록 (users 컬렉션 참조)
          example: ["user1", "user2", "user3"]
        activePromiseCount:
          type: integer
          description: 활성 약속 수
          example: 3
        maxMembers:
          type: integer
          description: 최대 인원
          example: 10
        inviteCode:
          type: string
          description: 초대 코드 (6자리)
          example: AB12CD
        createdBy:
          type: string
          description: 생성자 UID
          example: sFeDJwqJbqScbSUp4Jz54MDlnFv1
        createdAt:
          type: string
          format: date-time
          description: 생성 시각
        updatedAt:
          type: string
          format: date-time
          description: 수정 시각
        isDeleted:
          type: boolean
          description: 삭제 여부
          example: false

    # ========================================
    # User Document Schema
    # ========================================

    UserDocument:
      type: object
      description: |
        Firestore users/{userId} 문서 구조

        **그룹 목록 관리 방식**: groups Map
        - 기존: users/{userId}/groups/{groupId} 서브컬렉션 → N회 읽기
        - 변경: users/{userId} 문서 내 groups Map → 1회 읽기
        - 사용자가 10개 그룹에 속해도 1회 읽기로 모든 그룹 정보 조회
        - 읽기 비용 90% 절감 (10개 그룹 기준)
      properties:
        groups:
          type: object
          description: 그룹 목록 (groupId를 키로 하는 Map)
          additionalProperties:
            $ref: '#/components/schemas/UserGroupInfo'
          example:
            "groupId1":
              groupName: 주말 등산 모임
              role: admin
              joinedAt: "2024-01-01T00:00:00Z"
              notifications: true
            "groupId2":
              groupName: 회사 동료
              role: member
              joinedAt: "2024-01-15T00:00:00Z"
              notifications: true

    UserGroupInfo:
      type: object
      description: 사용자별 그룹 정보
      required:
        - groupName
        - role
        - joinedAt
        - notifications
      properties:
        groupName:
          type: string
          description: 그룹 이름 (캐시)
          example: 주말 등산 모임
        role:
          type: string
          description: 사용자 역할
          enum:
            - admin
            - member
          example: admin
        joinedAt:
          type: string
          format: date-time
          description: 그룹 가입 시각
        notifications:
          type: boolean
          description: 알림 활성화 여부
          example: true

    # ========================================
    # Promise Document Schema
    # ========================================

    PromiseDocument:
      type: object
      description: |
        Firestore promises/{promiseId} 문서 구조

        **투표 관리 방식**: votes Map
        - attendances 서브컬렉션 제거
        - votes.accepted: 참여 확정한 userId 배열
        - votes.declined: 참여 불가한 userId 배열
        - votes.until: 투표 마감 시각 (기본값: startAt)
        - pending: memberIds - accepted - declined (계산)
      required:
        - title
        - hostId
        - groupId
        - minimumParticipants
        - votes
        - startAt
        - status
        - createdAt
        - updatedAt
        - isDeleted
      properties:
        title:
          type: string
          description: 약속 제목
          example: 영화 관람
        emoji:
          type: string
          nullable: true
          description: 약속 이모지
          example: "🍿"
        description:
          type: string
          nullable: true
          description: 약속 설명
          example: 마블 신작 보러 가기
        hostId:
          type: string
          description: 호스트 ID
          example: user_kim123
        groupId:
          type: string
          description: 그룹 ID
          example: group_friends
        minimumParticipants:
          type: integer
          minimum: 2
          description: 최소 참가자 수 (확정 기준)
          example: 2
        votes:
          type: object
          description: 투표 정보 (상태별 userId 배열 + 마감 시각)
          required:
            - accepted
            - declined
            - until
          properties:
            accepted:
              type: array
              items:
                type: string
              description: 참여 확정한 userId 목록
              example: ["user_kim123", "user_lee456"]
            declined:
              type: array
              items:
                type: string
              description: 참여 불가한 userId 목록
              example: ["user_park789"]
            until:
              type: string
              format: date-time
              description: 투표 마감 시각 (기본값: startAt)
              example: "2024-01-15T19:00:00+09:00"
        startAt:
          type: string
          format: date-time
          description: 시작 시각
        endAt:
          type: string
          format: date-time
          nullable: true
          description: 종료 시각
        location:
          type: object
          nullable: true
          description: 장소 정보
          properties:
            name:
              type: string
              description: 장소명
              example: CGV 강남
        status:
          type: string
          enum:
            - pending
            - active
            - completed
            - cancelled
          description: 약속 상태
          example: active
        createdAt:
          type: string
          format: date-time
          description: 생성 시각
        updatedAt:
          type: string
          format: date-time
          description: 수정 시각
        isDeleted:
          type: boolean
          description: 삭제 여부
          example: false

    # ========================================
    # createPromise
    # ========================================

    CreatePromiseRequest:
      type: object
      required:
        - groupId
        - title
        - startAt
        - minimumParticipants
      properties:
        groupId:
          type: string
          description: 약속을 생성할 그룹 ID
          example: 0ec6e63d-8d80-4a76-9e1b-7f226c1c6b55

        title:
          type: string
          minLength: 1
          description: 약속 제목
          example: 주말 등산

        emoji:
          type: string
          nullable: true
          description: 약속 이모지 (선택적)
          example: "🏔️"

        description:
          type: string
          nullable: true
          description: 약속 설명 (선택적)
          example: 북한산 백운대 등반

        startAt:
          type: string
          format: date-time
          description: 시작 시간 (ISO 8601 문자열)
          example: "2024-12-25T10:00:00+09:00"

        endAt:
          type: string
          format: date-time
          nullable: true
          description: 종료 시간 (선택적, ISO 8601 문자열)
          example: "2024-12-25T16:00:00+09:00"

        minimumParticipants:
          type: integer
          minimum: 2
          description: 최소 참가 인원
          example: 3

        place:
          type: string
          nullable: true
          description: 장소 이름 (선택적)
          example: 북한산 백운대 입구

        arrivalSharingTime:
          type: integer
          nullable: true
          description: 도착 상황 공유 시작 시간 (분 단위, 선택적)
          example: 30

        env:
          type: string
          enum:
            - stage
            - prod
          description: 환경 구분 (선택적)
          example: stage

    CreatePromiseResponse:
      type: object
      required:
        - promiseId
        - title
        - groupId
        - startAt
      properties:
        promiseId:
          type: string
          description: 생성된 약속 ID
          example: xyz789abc123

        title:
          type: string
          description: 약속 제목
          example: 주말 등산

        groupId:
          type: string
          description: 그룹 ID
          example: 0ec6e63d-8d80-4a76-9e1b-7f226c1c6b55

        startAt:
          type: object
          description: 시작 시간 (Firebase Timestamp)
          properties:
            _seconds:
              type: integer
              description: Unix timestamp (초)
              example: 1735084800
            _nanoseconds:
              type: integer
              description: Nanoseconds
              example: 0

    RespondPromiseRequest:
      type: object
      required:
        - promiseId
        - status
      properties:
        promiseId:
          type: string
          description: 약속 ID
          example: promise_abc123

        status:
          type: string
          enum:
            - accepted
            - declined
          description: 응답 상태 (accepted=참여, declined=참여불가)
          example: accepted

        env:
          type: string
          enum:
            - stage
            - prod
          description: 환경 구분 (선택적)
          example: stage

    RespondPromiseResponse:
      type: object
      required:
        - promiseId
        - status
      properties:
        promiseId:
          type: string
          description: 약속 ID
          example: promise_abc123

        status:
          type: string
          enum:
            - accepted
            - declined
          description: 응답 상태 (accepted=참여, declined=참여불가)
          example: accepted

    # ========================================
    # testCallable
    # ========================================

    TestCallableRequest:
      type: object
      properties:
        name:
          type: string
          description: 사용자 이름
          example: 홍길동

    TestCallableResponse:
      type: object
      required:
        - message
        - authenticated
        - uid
      properties:
        message:
          type: string
          description: 인사 메시지
          example: Hello 홍길동!

        authenticated:
          type: boolean
          description: 인증 여부
          example: true

        uid:
          type: string
          nullable: true
          description: 사용자 UID (인증된 경우)
          example: abc123xyz

    # ========================================
    # Error
    # ========================================

    FunctionsError:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              enum:
                - unauthenticated
                - invalid-argument
                - permission-denied
                - not-found
                - already-exists
                - resource-exhausted
                - internal
                - unavailable
                - deadline-exceeded
              description: Firebase Functions 에러 코드
              example: invalid-argument

            message:
              type: string
              description: 에러 메시지
              example: 그룹 이름은 최소 2글자 이상이어야 합니다

            details:
              type: object
              description: 추가 에러 정보 (선택적)
              additionalProperties: true
