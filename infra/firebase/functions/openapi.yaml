      summary: ETA 업데이트
      description: |
        호출자의 도착 예상 시간(ETA)을 업데이트하고 모든 참가자에게 APNs update 이벤트를 브로드캐스트합니다.

        **인증 필수**: Firebase Authentication 토큰 필요
        **참가자만 가능**: 약속 참가자(accepted)만 업데이트 가능
      operationId: updateETA
      security:
        - firebaseAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - data
              properties:
                data:
                  $ref: '#/components/schemas/UpdateETARequest'
            examples:
              arrived:
                summary: 도착
                value:
                  data:
                    promiseId: promise_abc123
                    estimatedMinutes: 0
                    env: stage
              fiveMinutes:
                summary: 5분 후 도착
                value:
                  data:
                    promiseId: promise_abc123
                    estimatedMinutes: 5
                    env: stage
              tenMinutes:
                summary: 10분 후 도착
                value:
                  data:
                    promiseId: promise_abc123
                    estimatedMinutes: 10
                    env: stage

      responses:
        '200':
          description: ETA 업데이트 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    $ref: '#/components/schemas/UpdateETAResponse'
              examples:
                success:
                  value:
                    result:
                      success: true
                      successCount: 3
                      failureCount: 0

        '400':
          description: 잘못된 파라미터
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FunctionsError'
              examples:
                missingFields:
                  value:
                    error:
                      code: invalid-argument
                      message: promiseId와 estimatedMinutes는 필수입니다

        '401':
          $ref: '#/components/responses/Unauthenticated'

        '404':
          description: 약속을 찾을 수 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FunctionsError'
              examples:
                promiseNotFound:
                  value:
                    error:
                      code: not-found
                      message: 약속을 찾을 수 없습니다

  /widgetUpdateETA:
    post:
      tags:
        - LiveActivity
      summary: Widget 전용 ETA 업데이트
      description: |
        Widget Extension에서 ETA를 업데이트합니다.

        Widget Extension은 Firebase SDK를 사용할 수 없어서 별도의 HTTP 엔드포인트가 필요합니다.
        Firestore 사용 없이 클라이언트에서 전달받은 데이터로 Broadcast만 전송합니다.

        **인증**: X-User-Id 헤더 필수 (X-Auth-Token은 선택적)
      operationId: widgetUpdateETA
      parameters:
        - name: X-User-Id
          in: header
          required: true
          schema:
            type: string
          description: 사용자 ID
        - name: X-Auth-Token
          in: header
          required: false
          schema:
            type: string
          description: Firebase ID Token (선택적)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WidgetUpdateETARequest'
            examples:
              basic:
                summary: Widget ETA 업데이트
                value:
                  channelId: "ch_abc123"
                  participants:
                    - id: user_kim123
                      name: 김민수
                      estimatedArrivalMinutes: 5
                  trackingDurationMinutes: 30
                  env: stage

      responses:
        '200':
          description: ETA 업데이트 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WidgetUpdateETAResponse'
              examples:
                success:
                  value:
                    success: true

        '400':
          description: 잘못된 파라미터
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                missingFields:
                  value:
                    error:
                      code: invalid-argument
                      message: channelId and participants are required

        '401':
          description: 인증 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                missingUserId:
                  value:
                    error:
                      code: unauthenticated
                      message: X-User-Id header is required

        '405':
          description: 메서드 허용되지 않음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                methodNotAllowed:
                  value:
                    error:
                      code: method-not-allowed
                      message: Method not allowed

  # ========================================
  # Emoji
  # ========================================

  /generateEmoji:
    post:
      tags:
        - Emoji
      summary: 이모지 생성
      description: |
        약속 제목에 어울리는 이모지를 Gemini API를 통해 생성합니다.

        **인증 필수**: Firebase Authentication 토큰 필요
      operationId: generateEmoji
      security:
        - firebaseAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - data
              properties:
                data:
                  $ref: '#/components/schemas/GenerateEmojiRequest'
            examples:
              lunch:
                summary: 점심 약속
                value:
                  data:
                    title: 점심 같이 먹자
              movie:
                summary: 영화 관람
                value:
                  data:
                    title: 영화 보러 갈 사람

      responses:
        '200':
          description: 이모지 생성 성공
          content:
            application/json:
              schema:
                type: object
                required:
                  - result
                properties:
                  result:
                    $ref: '#/components/schemas/GenerateEmojiResponse'
              examples:
                lunch:
                  summary: 점심 이모지
                  value:
                    result:
                      emoji: "🍽️"
                movie:
                  summary: 영화 이모지
                  value:
                    result:
                      emoji: "🎬"

        '400':
          description: 잘못된 요청
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FunctionsError'
              examples:
                emptyTitle:
                  value:
                    error:
                      code: invalid-argument
                      message: 제목이 비어있습니다

        '401':
          $ref: '#/components/responses/Unauthenticated'

        '500':
          description: 서버 오류 (기본 이모지 📅 반환)
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    $ref: '#/components/schemas/GenerateEmojiResponse'
              examples:
                fallback:
                  value:
                    result:
                      emoji: "📅"

components:
  securitySchemes:
    firebaseAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Firebase Authentication 토큰

  responses:
    Unauthenticated:
      description: 인증 실패
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/FunctionsError'
          examples:
            unauthenticated:
              value:
                error:
                  code: unauthenticated
                  message: 로그인이 필요합니다

    InvalidArgument:
      description: 잘못된 파라미터
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/FunctionsError'
          examples:
            invalidArgument:
              value:
                error:
                  code: invalid-argument
                  message: 잘못된 파라미터입니다

  schemas:
    # ========================================
    # Emoji
    # ========================================

    GenerateEmojiRequest:
      type: object
      required:
        - title
      properties:
        title:
          type: string
          minLength: 1
          description: 약속 제목
          example: 점심 같이 먹자

    GenerateEmojiResponse:
      type: object
      required:
        - emoji
      properties:
        emoji:
          type: string
          description: 생성된 이모지
          example: "🍽️"

    # ========================================
    # Snapshot (Widget/Home 공용)
    # ========================================

    SnapshotPromise:
      type: object
      description: Widget/Home 공용 약속 스냅샷 타입
      required:
        - id
        - title
        - emoji
        - startAt
        - groupId
        - isConfirmed
        - minimumParticipants
        - participantCount
        - myVoteStatus
      properties:
        id:
          type: string
          description: 약속 ID
          example: promise123
        title:
          type: string
          description: 약속 제목
          example: 점심 약속
        emoji:
          type: string
          description: 대표 이모지
          example: "🍜"
        startAt:
          type: string
          format: date-time
          description: 시작 시간 (ISO 8601)
          example: "2026-02-01T12:00:00+09:00"
        endAt:
          type: string
          format: date-time
          nullable: true
          description: 종료 시간 (ISO 8601)
          example: "2026-02-01T14:00:00+09:00"
        location:
          type: string
          nullable: true
          description: 장소명
          example: 강남역 2번 출구
        groupId:
          type: string
          description: 그룹 ID
          example: group456
        groupName:
          type: string
          nullable: true
          description: 그룹 이름
          example: 대학 동기
        groupImageUrl:
          type: string
          format: uri
          nullable: true
          description: 그룹 이미지 URL
          example: https://storage.googleapis.com/.../group.jpg
        isConfirmed:
          type: boolean
          description: 약속 확정 여부
          example: true
        minimumParticipants:
          type: integer
          description: 최소 확정 인원
          example: 2
        participantCount:
          type: integer
          description: 참여 확정 인원
          example: 3
        myVoteStatus:
          type: string
          enum:
            - pending
            - voted
            - declined
          description: 내 투표 상태
          example: voted
        votingDeadline:
          type: string
          format: date-time
          nullable: true
          description: 투표 마감 시간 (ISO 8601)
          example: "2026-02-01T10:00:00+09:00"

    WidgetSnapshotDocument:
      type: object
      description: Widget용 스냅샷 문서
      required:
        - next
        - today
        - upcoming
        - meta
      properties:
        next:
          allOf:
            - $ref: '#/components/schemas/SnapshotPromise'
          nullable: true
          description: Small 위젯용 다음 약속
        today:
          type: array
          items:
            $ref: '#/components/schemas/SnapshotPromise'
          description: Medium 위젯용 오늘 약속 (최대 5개)
        upcoming:
          type: array
          items:
            $ref: '#/components/schemas/SnapshotPromise'
          description: Large 위젯용 다가오는 약속 (최대 7개)
        meta:
          $ref: '#/components/schemas/WidgetSnapshotMeta'

    WidgetSnapshotMeta:
      type: object
      required:
        - todayCount
        - upcomingCount
        - updatedAt
        - version
      properties:
        todayCount:
          type: integer
          description: 오늘 약속 개수
          example: 2
        upcomingCount:
          type: integer
          description: 다가오는 약속 개수
          example: 5
        updatedAt:
          type: string
          format: date-time
          description: 마지막 갱신 시간
          example: "2026-02-01T10:30:00+09:00"
        version:
          type: integer
          description: 스키마 버전
          example: 1

    HomeSnapshotDocument:
      type: object
      description: Home용 스냅샷 문서
      required:
        - todayPromises
        - pendingPromises
        - upcomingPromises
        - groups
        - meta
      properties:
        todayPromises:
          type: array
          items:
            $ref: '#/components/schemas/SnapshotPromise'
          description: 오늘 확정 약속 (최대 5개)
        pendingPromises:
          type: array
          items:
            $ref: '#/components/schemas/SnapshotPromise'
          description: 응답 필요 약속 (최대 5개, 마감 임박순)
        upcomingPromises:
          type: array
          items:
            $ref: '#/components/schemas/SnapshotPromise'
          description: 다가오는 확정 약속 (최대 10개)
        groups:
          type: array
          items:
            $ref: '#/components/schemas/HomeSnapshotGroup'
          description: 그룹별 요약 정보
        meta:
          $ref: '#/components/schemas/HomeSnapshotMeta'

    HomeSnapshotGroup:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
          description: 그룹 ID
          example: group456
        name:
          type: string
          description: 그룹 이름
          example: 대학 동기
        emoji:
          type: string
          nullable: true
          description: 그룹 이모지
          example: "🎓"
        imageUrl:
          type: string
          format: uri
          nullable: true
          description: 그룹 이미지 URL
          example: https://storage.googleapis.com/.../group.jpg
        nextPromise:
          allOf:
            - $ref: '#/components/schemas/SnapshotPromise'
          nullable: true
          description: 다음 약속

    HomeSnapshotMeta:
      type: object
      required:
        - todayCount
        - pendingCount
        - upcomingCount
        - updatedAt
        - version
      properties:
        todayCount:
          type: integer
          description: 오늘 약속 개수
          example: 1
        pendingCount:
          type: integer
          description: 응답 필요 약속 개수
          example: 2
        upcomingCount:
          type: integer
          description: 다가오는 약속 개수
          example: 5
        updatedAt:
          type: string
          format: date-time
          description: 마지막 갱신 시간
          example: "2026-02-01T10:30:00+09:00"
        version:
          type: integer
          description: 스키마 버전
          example: 1

    # ========================================
    # User
    # ========================================

    CreateUserRequest:
      type: object
      required:
        - nickname
        - provider
      properties:
        name:
          type: string
          nullable: true
          description: provider에서 받은 이름 (선택적, null이면 nickname 사용)
          example: 김성원
        nickname:
          type: string
          minLength: 2
          maxLength: 12
          description: 사용자가 설정한 닉네임
          example: 성원
        provider:
          type: object
          required:
            - type
            - uid
            - email
          properties:
            type:
              type: string
              enum:
                - google
                - apple
              description: 인증 제공자 타입
              example: google
            uid:
              type: string
              description: 제공자 기준 사용자 ID
              example: "100163668057674322269"
            email:
              type: string
              format: email
              description: 제공자에서 받은 이메일
              example: kswen0203@gmail.com

    CreateUserResponse:
      type: object
      required:
        - userId
        - createdAt
      properties:
        userId:
          type: string
          description: 생성된 사용자 ID (Firebase Auth UID)
          example: sFeDJwqJbqScbSUp4Jz54MDlnFv1
        createdAt:
          type: string
          format: date-time
          description: 계정 생성 시각
          example: "2025-01-05T10:00:00Z"

    GetUserRequest:
      type: object
      properties:
        userId:
          type: string
          nullable: true
          description: 조회할 사용자 ID (생략 시 본인)
          example: otherUserId

    UserPublic:
      type: object
      description: 타인 조회 시 반환되는 사용자 정보 (이메일 제외)
      required:
        - userId
        - name
        - nickname
        - metaData
      properties:
        userId:
          type: string
          description: 사용자 ID
          example: sFeDJwqJbqScbSUp4Jz54MDlnFv1
        name:
          type: string
          description: provider에서 받은 이름
          example: 김성원
        nickname:
          type: string
          description: 사용자 설정 닉네임
          example: 성원
        profile:
          type: object
          nullable: true
          description: 프로필 이미지 정보
          required:
            - url
            - updatedAt
          properties:
            url:
              type: string
              format: uri
              description: 원본 이미지 URL
              example: https://storage.googleapis.com/.../profile.jpg
            thumbUrl:
              type: string
              format: uri
              nullable: true
              description: 썸네일 URL
              example: https://storage.googleapis.com/.../thumb_profile.jpg
            updatedAt:
              type: string
              format: date-time
              description: 업데이트 시각
              example: "2025-01-05T10:00:00Z"
        metaData:
          type: object
          required:
            - createdAt
            - updatedAt
          properties:
            createdAt:
              type: string
              format: date-time
              description: 생성 시각
              example: "2024-12-19T10:00:00Z"
            updatedAt:
              type: string
              format: date-time
              description: 수정 시각
              example: "2025-01-05T10:00:00Z"

    UserPrivate:
      type: object
      description: 본인 조회 시 반환되는 사용자 정보 (이메일 포함)
      required:
        - userId
        - name
        - nickname
        - email
        - provider
        - metaData
      properties:
        userId:
          type: string
          description: 사용자 ID
          example: sFeDJwqJbqScbSUp4Jz54MDlnFv1
        name:
          type: string
          description: provider에서 받은 이름
          example: 김성원
        nickname:
          type: string
          description: 사용자 설정 닉네임
          example: 성원
        email:
          type: string
          format: email
          description: 이메일 주소 (auth 서브컬렉션에서 조회)
          example: kswen0203@gmail.com
        provider:
          type: string
          description: 인증 제공자 타입 (auth 서브컬렉션에서 조회)
          example: google
        profile:
          type: object
          nullable: true
          description: 프로필 이미지 정보
          required:
            - url
            - updatedAt
          properties:
            url:
              type: string
              format: uri
              description: 원본 이미지 URL
              example: https://storage.googleapis.com/.../profile.jpg
            thumbUrl:
              type: string
              format: uri
              nullable: true
              description: 썸네일 URL
              example: https://storage.googleapis.com/.../thumb_profile.jpg
            updatedAt:
              type: string
              format: date-time
              description: 업데이트 시각
              example: "2025-01-05T10:00:00Z"
        metaData:
          type: object
          required:
            - createdAt
            - updatedAt
          properties:
            createdAt:
              type: string
              format: date-time
              description: 생성 시각
              example: "2024-12-19T10:00:00Z"
            updatedAt:
              type: string
              format: date-time
              description: 수정 시각
              example: "2025-01-05T10:00:00Z"

    UserResponse:
      oneOf:
        - $ref: '#/components/schemas/UserPublic'
        - $ref: '#/components/schemas/UserPrivate'
      description: |
        조건부 응답 스키마:
        - 본인 조회 시: UserPrivate (이메일 포함)
        - 타인 조회 시: UserPublic (이메일 제외)

    UpdateUserRequest:
      type: object
      properties:
        nickname:
          type: string
          minLength: 2
          maxLength: 12
          nullable: true
          description: 닉네임
          example: 새로운닉네임

    UpdateUserResponse:
      type: object
      required:
        - success
        - updatedAt
      properties:
        success:
          type: boolean
          description: 성공 여부
          example: true
        updatedAt:
          type: string
          format: date-time
          description: 수정 시각
          example: "2025-01-05T10:30:00Z"

    UploadProfileImageRequest:
      type: object
      required:
        - imagePath
      properties:
        imagePath:
          type: string
          description: Firebase Storage에 업로드된 이미지 경로
          example: profile_images/sFeDJwqJbqScbSUp4Jz54MDlnFv1.jpg

    UploadProfileImageResponse:
      type: object
      required:
        - profile
      properties:
        profile:
          type: object
          required:
            - url
            - updatedAt
          properties:
            url:
              type: string
              format: uri
              description: 원본 이미지 downloadURL
              example: https://storage.googleapis.com/.../profile.jpg
            updatedAt:
              type: string
              format: date-time
              description: 업데이트 시각
              example: "2025-01-05T10:00:00Z"

    # ========================================
    # Settings
    # ========================================

    UserSettingsResponse:
      type: object
      required:
        - notificationEnabled
      properties:
        notificationEnabled:
          type: boolean
          description: 알림 활성화 여부
          example: true
        plan:
          type: string
          nullable: true
          description: 사용자 플랜
          enum:
            - free
            - pro
          example: free

    UpdateUserSettingsRequest:
      type: object
      properties:
        notificationEnabled:
          type: boolean
          nullable: true
          description: 알림 활성화 여부
          example: false
        plan:
          type: string
          nullable: true
          description: 사용자 플랜
          enum:
            - free
            - pro
          example: pro

    UpdateUserSettingsResponse:
      type: object
      required:
        - success
      properties:
        success:
          type: boolean
          description: 성공 여부
          example: true

    CheckNicknameAvailableRequest:
      type: object
      required:
        - nickname
      properties:
        nickname:
          type: string
          minLength: 2
          maxLength: 20
          description: 검사할 닉네임
          example: 새닉네임

        env:
          type: string
